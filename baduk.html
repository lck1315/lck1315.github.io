<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DODO Baduk | 3D 프리미엄 바둑</title>

    <meta name="description" content="DODO.game - 프리미엄 3D 그래픽으로 즐기는 정통 바둑">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Noto+Sans+KR:wght@300;400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            margin: 0;
            overflow: hidden;
            background: #1e1b18; /* 다크 우드톤 배경 */
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            color: #f8fafc;
        }

        #game-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
        }

        /* ── UI 오버레이 ── */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(30,27,24,0.9), transparent);
            pointer-events: auto;
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span { background: linear-gradient(135deg, #d97706, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .game-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .score-board {
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .score-val {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            font-weight: 700;
            min-width: 150px;
            justify-content: center;
        }

        .turn-stone {
            width: 20px; height: 20px;
            border-radius: 50%;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.4), 2px 2px 5px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .turn-stone.black { background: #111; }
        .turn-stone.white { background: #f8f9fa; box-shadow: inset -3px -3px 6px rgba(0,0,0,0.1), 2px 2px 5px rgba(0,0,0,0.5); }

        .controls {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            pointer-events: auto;
        }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn.primary { background: linear-gradient(135deg, #d97706, #b45309); border: none; }
        .btn.primary:hover { transform: scale(1.05); }

        .footer {
            padding: 20px;
            text-align: center;
            pointer-events: none;
        }

        /* ── 결과 모달 ── */
        #result-modal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(30,27,24,0.95);
            border: 1px solid rgba(217,119,6,0.3);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(217,119,6,0.2);
            backdrop-filter: blur(15px);
            z-index: 100;
            pointer-events: auto;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        #result-modal.show {
            opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1);
        }
        .result-title {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fde68a, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .result-desc {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 30px;
        }
        
        /* ── 로딩 스피너 ── */
        #loading {
            position: absolute; inset:0; background:#1e1b18; z-index:999;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            color: #d97706; font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight:700;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(217,119,6,0.2);
            border-top-color: #d97706;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 알림 메시지 (자충수 등) */
        #toast {
            position: absolute;
            top: 100px; left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }
        #toast.show { opacity: 1; }

    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div>Loading 3D Board...</div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="game-container"></div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <div class="header">
            <a href="game.html" class="logo">
                <i class="fa-solid fa-gamepad"></i> DODO <span>Baduk</span>
            </a>
            
            <div class="game-info">
                <div class="score-board">
                    <div class="score-item">
                        <span>흑 사석</span>
                        <span class="score-val" id="score-black">0</span>
                    </div>
                    <div class="score-item">
                        <span>백 사석</span>
                        <span class="score-val" id="score-white">0</span>
                    </div>
                </div>
                
                <div class="turn-indicator">
                    <div id="turn-stone-icon" class="turn-stone black"></div>
                    <span id="turn-text">흑돌 차례</span>
                </div>
                <div class="controls">
                    <button class="btn" onclick="passTurn()"><i class="fa-solid fa-forward-step"></i> 패스</button>
                    <button class="btn primary" onclick="resetGame()"><i class="fa-solid fa-rotate-right"></i> 새 게임</button>
                </div>
            </div>
        </div>

        <div id="toast">자충수(Suicide)는 둘 수 없습니다!</div>

        <div class="footer">
            <p style="color: rgba(255,255,255,0.4); font-size: 0.8rem; letter-spacing:1px;">Scroll to zoom, Click & Drag to rotate board. (2인 로컬 전용)</p>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal">
        <div class="result-title" id="result-title">게임 종료</div>
        <div class="result-desc" id="result-desc">양측이 모두 패스하여 게임이 종료되었습니다.</div>
        <button class="btn primary" style="font-size:1.1rem; padding: 12px 30px;" onclick="resetGame()">다시 플레이</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ==========================================
        // 1. 전역 변수 및 게임 상태
        // ==========================================
        const GRID_SIZE = 19; // 19x19 정규 바둑판
        const BOARD_PHYSICAL_SIZE = 16; // 3D 판 크기
        const GRID_STEP = BOARD_PHYSICAL_SIZE / (GRID_SIZE - 1);
        
        let scene, camera, renderer, controls;
        let boardMesh;
        let stones = []; // 3D 돌 객체 배열 { mesh, x, z, player }
        let boardState = []; // 0: empty, 1: black, 2: white
        
        let currentTurn = 1; // 1: 흑, 2: 백
        let isGameOver = false;
        
        let capturedBlack = 0; // 백이 따낸 흑돌 수 (백의 득점)
        let capturedWhite = 0; // 흑이 따낸 백돌 수 (흑의 득점)
        let passCount = 0; // 연속 패스 카운트
        
        // 패(Ko) 룰 처리를 위한 마지막 캡처 상태
        let lastKoPoint = null; // {x, z}

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        // 돌 재질
        let blackMat, whiteMat;

        // 초기화 호출
        init3D();
        initGame();
        
        // ==========================================
        // 2. Three.js 초기화 및 씬(Scene) 구성
        // ==========================================
        function init3D() {
            const container = document.getElementById('game-container');
            
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x1e1b18, 0.015);
            
            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 14, 14);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            
            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.1;
            controls.minDistance = 5;
            controls.maxDistance = 30;
            
            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            
            const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
            dirLight.position.set(10, 25, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -12;
            dirLight.shadow.camera.right = 12;
            dirLight.shadow.camera.top = 12;
            dirLight.shadow.camera.bottom = -12;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xd97706, 0.5, 40);
            pointLight.position.set(-10, 8, -10);
            scene.add(pointLight);
            
            // Materials
            // 프리미엄 바둑판 (가야산 비자나무 느낌의 노란/갈색 톤)
            const boardMat = new THREE.MeshPhysicalMaterial({
                color: 0xdca864,
                roughness: 0.7,
                metalness: 0.1,
                clearcoat: 0.3,
                clearcoatRoughness: 0.4
            });
            
            // 오목알보다 작고 둥근 바둑알 재질
            blackMat = new THREE.MeshPhysicalMaterial({
                color: 0x111111,
                roughness: 0.2,
                metalness: 0.15,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });
            
            whiteMat = new THREE.MeshPhysicalMaterial({
                color: 0xf8f9fa,
                roughness: 0.2,
                metalness: 0.05,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });
            
            // Create Board
            const boardThickness = 1.2;
            const boardGeo = new THREE.BoxGeometry(BOARD_PHYSICAL_SIZE + 1.2, boardThickness, BOARD_PHYSICAL_SIZE + 1.2);
            boardMesh = new THREE.Mesh(boardGeo, boardMat);
            boardMesh.position.y = -boardThickness / 2;
            boardMesh.receiveShadow = true;
            boardMesh.castShadow = true;
            scene.add(boardMesh);
            
            // 다리
            const legGeo = new THREE.BoxGeometry(1.2, 2.5, 1.2);
            const legDist = BOARD_PHYSICAL_SIZE / 2.2;
            const legsPos = [
                [-legDist, -legDist], [legDist, -legDist],
                [-legDist, legDist], [legDist, legDist]
            ];
            legsPos.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, boardMat);
                leg.position.set(pos[0], -boardThickness - 1.25, pos[1]);
                leg.castShadow = true;
                scene.add(leg);
            });
            
            // 그리드 라인 (19x19)
            createGridLines();
            
            // 바닥 (다크 우드톤)
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e1b18, roughness: 0.9 });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -boardThickness - 3;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // 이벤트 리스너
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
            }, 500);

            animate();
        }
        
        function createGridLines() {
            const lineMat = new THREE.LineBasicMaterial({ color: 0x3d2613, linewidth: 2 });
            const offset = BOARD_PHYSICAL_SIZE / 2;
            
            for(let i=0; i<GRID_SIZE; i++) {
                const pos = -offset + (i * GRID_STEP);
                // 가로선
                const hGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-offset, 0.01, pos),
                    new THREE.Vector3(offset, 0.01, pos)
                ]);
                const hLine = new THREE.Line(hGeo, lineMat);
                scene.add(hLine);
                
                // 세로선
                const vGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(pos, 0.01, -offset),
                    new THREE.Vector3(pos, 0.01, offset)
                ]);
                const vLine = new THREE.Line(vGeo, lineMat);
                scene.add(vLine);
            }
            
            // 화점 (9개 - 19x19 바둑판 표준 화점: (3,3), (3,9), (3,15) 등)
            const dotMat = new THREE.MeshBasicMaterial({ color: 0x3d2613 });
            const dotGeo = new THREE.CircleGeometry(0.08, 16);
            
            const starPoints = [
                [3,3], [9,3], [15,3],
                [3,9], [9,9], [15,9],
                [3,15], [9,15], [15,15]
            ];
            
            starPoints.forEach(pt => {
                const px = -offset + (pt[0] * GRID_STEP);
                const pz = -offset + (pt[1] * GRID_STEP);
                const dot = new THREE.Mesh(dotGeo, dotMat);
                dot.rotation.x = -Math.PI / 2;
                dot.position.set(px, 0.015, pz);
                scene.add(dot);
            });
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        // ==========================================
        // 3. 바둑 로직 (Liberties, Capture, Ko, Suicide)
        // ==========================================
        function initGame() {
            boardState = Array.from(Array(GRID_SIZE), () => new Array(GRID_SIZE).fill(0));
            
            // 기존 돌 3D 메쉬 모두 삭제
            stones.forEach(s => scene.remove(s.mesh));
            stones = [];
            
            currentTurn = 1; // 흑돌
            isGameOver = false;
            capturedBlack = 0;
            capturedWhite = 0;
            passCount = 0;
            lastKoPoint = null;
            
            updateUI();
            document.getElementById('result-modal').classList.remove('show');
        }
        
        function updateUI() {
            const icon = document.getElementById('turn-stone-icon');
            const text = document.getElementById('turn-text');
            
            if (currentTurn === 1) {
                icon.className = 'turn-stone black';
                text.textContent = '흑돌 차례';
            } else {
                icon.className = 'turn-stone white';
                text.textContent = '백돌 차례';
            }
            
            document.getElementById('score-black').textContent = capturedWhite; // 흑이 잡은 백돌 수 (사석)
            document.getElementById('score-white').textContent = capturedBlack; // 백이 잡은 흑돌 수 (사석)
        }
        
        function passTurn() {
            if (isGameOver) return;
            passCount++;
            
            if (passCount >= 2) {
                // 양측 모두 패스 시 게임 종료
                endGame();
                return;
            }
            
            lastKoPoint = null; // 패스하면 패(Ko) 룰 리셋
            currentTurn = currentTurn === 1 ? 2 : 1;
            updateUI();
        }
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        function onPointerDown(event) {
            if (isGameOver) return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(boardMesh);
            
            if (intersects.length > 0) {
                const p = intersects[0].point;
                const offset = BOARD_PHYSICAL_SIZE / 2;
                
                let x = Math.round((p.x + offset) / GRID_STEP);
                let z = Math.round((p.z + offset) / GRID_STEP);
                
                if (x >= 0 && x < GRID_SIZE && z >= 0 && z < GRID_SIZE) {
                    tryPlaceStone(x, z);
                }
            }
        }
        
        function tryPlaceStone(x, z) {
            if (boardState[x][z] !== 0) return; // 이미 돌이 있음
            
            // 패(Ko) 룰 확인
            if (lastKoPoint && lastKoPoint.x === x && lastKoPoint.z === z) {
                showToast("패(Ko) 규칙에 의해 지금은 둘 수 없습니다!");
                return;
            }
            
            const opponent = currentTurn === 1 ? 2 : 1;
            
            // 임시로 돌을 놓아봄
            boardState[x][z] = currentTurn;
            
            // 1. 상대방 그룹 포위 여부 (따내기)
            let capturedStones = [];
            const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
            
            for (let d of dirs) {
                const nx = x + d[0]; const nz = z + d[1];
                if (nx >= 0 && nx < GRID_SIZE && nz >= 0 && nz < GRID_SIZE) {
                    if (boardState[nx][nz] === opponent) {
                        const group = getGroup(nx, nz, opponent);
                        if (getLiberties(group) === 0) {
                            capturedStones.push(...group);
                        }
                    }
                }
            }
            
            // 중복 제거 (여러 방향에서 같은 그룹을 찾았을 수 있음)
            capturedStones = capturedStones.filter((v, i, a) => a.findIndex(t => (t.x === v.x && t.z === v.z)) === i);
            
            // 2. 자충수(Suicide) 방지: 따낸 돌이 없는데 내 그룹의 공배가 0이면 자충수
            if (capturedStones.length === 0) {
                const myGroup = getGroup(x, z, currentTurn);
                if (getLiberties(myGroup) === 0) {
                    // 원상 복구 후 반려
                    boardState[x][z] = 0;
                    showToast("자충수(Suicide)는 둘 수 없습니다!");
                    return;
                }
            }
            
            // 유효한 착수이므로 실제 진행
            passCount = 0; // 패스 초기화
            
            // 패(Ko) 설정: 1개의 돌을 놓아 딱 1개의 상대 돌만 따냈을 때, 그 자리로는 바로 되따낼 수 없음
            let newKoPoint = null;
            if (capturedStones.length === 1) {
                const myGroup = getGroup(x, z, currentTurn);
                if (myGroup.length === 1 && getLiberties(myGroup) === 1) {
                    newKoPoint = { x: capturedStones[0].x, z: capturedStones[0].z };
                }
            }
            lastKoPoint = newKoPoint;
            
            // 상대 돌 제거 (배열 상태 & 3D 씬)
            if (capturedStones.length > 0) {
                capturedStones.forEach(pt => {
                    boardState[pt.x][pt.z] = 0;
                    // 3D 메쉬 찾아서 지우기
                    const idx = stones.findIndex(s => s.x === pt.x && s.z === pt.z);
                    if (idx !== -1) {
                        scene.remove(stones[idx].mesh);
                        stones.splice(idx, 1);
                    }
                });
                
                if (currentTurn === 1) capturedWhite += capturedStones.length;
                else capturedBlack += capturedStones.length;
            }
            
            // 내 돌 렌더링
            renderStone(x, z, currentTurn);
            playStoneSound();
            
            // 턴 넘기기
            currentTurn = opponent;
            updateUI();
        }
        
        // 특정 위치의 동일한 색상 돌 그룹 탐색 (BFS)
        function getGroup(startX, startZ, player) {
            const group = [];
            const queue = [{x: startX, z: startZ}];
            const visited = Array.from(Array(GRID_SIZE), () => new Array(GRID_SIZE).fill(false));
            
            visited[startX][startZ] = true;
            group.push({x: startX, z: startZ});
            
            let head = 0;
            const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
            
            while(head < queue.length) {
                const curr = queue[head++];
                for (let d of dirs) {
                    const nx = curr.x + d[0]; const nz = curr.z + d[1];
                    if (nx >= 0 && nx < GRID_SIZE && nz >= 0 && nz < GRID_SIZE) {
                        if (!visited[nx][nz] && boardState[nx][nz] === player) {
                            visited[nx][nz] = true;
                            queue.push({x: nx, z: nz});
                            group.push({x: nx, z: nz});
                        }
                    }
                }
            }
            return group;
        }
        
        // 주어진 그룹의 총 공배(Liberties) 수 계산
        function getLiberties(group) {
            let liberties = 0;
            const counted = Array.from(Array(GRID_SIZE), () => new Array(GRID_SIZE).fill(false));
            const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
            
            for (let pt of group) {
                for (let d of dirs) {
                    const nx = pt.x + d[0]; const nz = pt.z + d[1];
                    if (nx >= 0 && nx < GRID_SIZE && nz >= 0 && nz < GRID_SIZE) {
                        if (boardState[nx][nz] === 0 && !counted[nx][nz]) {
                            counted[nx][nz] = true;
                            liberties++;
                        }
                    }
                }
            }
            return liberties;
        }
        
        function renderStone(x, z, player) {
            const offset = BOARD_PHYSICAL_SIZE / 2;
            const px = -offset + (x * GRID_STEP);
            const pz = -offset + (z * GRID_STEP);
            
            // 바둑알 (타원체 모양)
            const stoneGeo = new THREE.SphereGeometry(BOARD_PHYSICAL_SIZE/(GRID_SIZE*2.1), 32, 16);
            stoneGeo.applyMatrix4(new THREE.Matrix4().makeScale(1, 0.5, 1));
            
            const stoneMesh = new THREE.Mesh(stoneGeo, player === 1 ? blackMat : whiteMat);
            stoneMesh.position.set(px, 0.1, pz);
            stoneMesh.castShadow = true;
            stoneMesh.receiveShadow = true;
            
            scene.add(stoneMesh);
            stones.push({ mesh: stoneMesh, x: x, z: z, player: player });
        }
        
        function playStoneSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                // 바둑알은 오목알보다 맑고 경쾌한 틱 소리
                osc.frequency.setValueAtTime(1000, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.6, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch(e) {}
        }
        
        function endGame() {
            isGameOver = true;
            const modal = document.getElementById('result-modal');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            
            title.textContent = '게임 종료';
            // 실제 바둑은 영토(집) 계산이 들어가야 하나 로컬 버전이므로 단순 표시
            let resultStr = `(사석 - 흑: ${capturedWhite} / 백: ${capturedBlack})<br>계가는 생략합니다.`;
            
            desc.innerHTML = `양측이 모두 패스했습니다.<br><br><span style="font-size:0.9rem; color:#94a3b8;">${resultStr}</span>`;
            modal.classList.add('show');
        }
    </script>
</body>
