<!DOCTYPE html>
<html>
<head>
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet/dist/plugins/css/pluginsCss.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet/dist/plugins/plugins.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet/dist/css/luckysheet.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet/dist/assets/iconfont/iconfont.css' />
    <script src="https://cdn.jsdelivr.net/npm/luckysheet/dist/plugins/js/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckysheet/dist/luckysheet.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckyexcel/dist/luckyexcel.umd.js"></script>
</head>
<body>
    <div id="luckysheet" style="margin:0;padding:0;position:absolute;width:100%;height:100%;left:0;top:0;"></div>
    <script>
        window.onload = function() {
            var data = "A,B\n1,2\n3,4";
            var workbook = XLSX.read(data, { type: 'string' });
            var xlsxArrayBuffer = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
            var newFile = new File([xlsxArrayBuffer], "test.xlsx", { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            
            // First initialization with lang: 'ko'
            luckysheet.create({ container: 'luckysheet', lang: 'ko' });

            setTimeout(function() {
                LuckyExcel.transformExcelToLucky(newFile, function(exportJson) {
                    console.log("Success", exportJson);
                    try {
                        luckysheet.destroy();
                    } catch(e) {}

                    try {
                        luckysheet.create({
                            container: 'luckysheet',
                            lang: 'ko',
                            data: exportJson.sheets
                        });
                        console.log("Re-created successfully with lang: ko");
                    } catch(err) {
                        console.error("Crash on recreate with lang: ko:", err);
                    }
                }, function(err) {
                    console.error("Error", err);
                });
            }, 1000);
        }
    </script>
</body>
</html>
