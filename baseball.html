<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DODO Baseball | Full Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Noto Sans KR', sans-serif; }

/* ─── Canvas ─── */
#game-canvas { display: block; width: 100%; height: 100%; }

/* ─── UI Overlay ─── */
.ui-layer { position: absolute; inset: 0; pointer-events: none; }
.pointer-events-auto { pointer-events: auto; }

/* ─── 스코어보드 ─── */
#scoreboard {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    display: flex; background: rgba(15,23,42,0.85);
    border: 2px solid rgba(255,255,255,0.1); border-radius: 12px;
    color: #fff; font-family: 'Oswald', sans-serif;
    box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    backdrop-filter: blur(5px);
}
.sb-team { padding: 8px 15px; font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sb-team.away { background: rgba(51,65,85,0.7); border-radius: 10px 0 0 10px;}
.sb-team.home { background: rgba(185,28,28,0.7); border-radius: 0 10px 10px 0;}
.sb-score { font-size: 1.8rem; font-weight: 900; width: 35px; text-align: center; }
.sb-center { padding: 5px 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 140px; }
.sb-inning { font-size: 0.9rem; color: #cbd5e1; font-weight: 700; }
.sb-count { display: flex; gap: 10px; margin-top: 4px; }
.cnt-group { display: flex; align-items: center; gap: 4px; }
.cnt-lbl { font-size: 0.75rem; color: #94a3b8; font-weight: 700; }
.cnt-dots { display: flex; gap: 3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #334155; border: 1px solid #1e293b; }
.dot.b.lit { background: #22c55e; border-color: #16a34a; box-shadow: 0 0 5px #22c55e; }
.dot.s.lit { background: #ef4444; border-color: #dc2626; box-shadow: 0 0 5px #ef4444; }
.dot.o.lit { background: #f59e0b; border-color: #d97706; box-shadow: 0 0 5px #f59e0b; }

/* ─── 미니맵 (루상 상황) ─── */
#minimap {
    position: absolute; top: 90px; right: 20px;
    width: 80px; height: 80px;
    background: rgba(15,23,42,0.8);
    border: 2px solid rgba(255,255,255,0.1); border-radius: 10px;
    transform: rotate(45deg);
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}
.base {
    position: absolute; width: 16px; height: 16px;
    background: #334155; border: 2px solid #1e293b;
    transform: translate(-50%, -50%);
}
.base.on { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
#base-1 { bottom: 0; right: 0; }
#base-2 { top: 0; right: 0; }
#base-3 { top: 0; left: 0; }
#base-h { bottom: 0; left: 0; border-radius: 50%; background: #fff;}

/* ─── 상단 좌측 (모드 정보) ─── */
#mode-info {
    position: absolute; top: 20px; left: 20px;
    background: rgba(15,23,42,0.8); padding: 10px 20px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
    color: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}
.mi-title { font-size: 0.8rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
.mi-mode { font-size: 1.4rem; font-weight: 900; color: #3b82f6; }
.mi-mode.defense { color: #ef4444; }

/* ─── 중앙 메세지 (이닝 교대 등) ─── */
#center-msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: 'Oswald', 'Noto Sans KR', sans-serif;
    font-size: 4rem; font-weight: 900; color: #fff;
    text-shadow: 0 5px 20px rgba(0,0,0,0.8);
    text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 0.3s; z-index: 500;
}
#center-msg.show { opacity: 1; }
.cm-sub { font-size: 1.5rem; color: #f59e0b; }

/* ─── 수비(투수) UI ─── */
#pitch-ui { display: none; }
#pitch-controls {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 100;
}
.pitch-btn {
    background: rgba(15,23,42,0.8); border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px; color: #fff; padding: 10px 15px;
    font-family: 'Oswald', 'Noto Sans KR', sans-serif; font-size: 1.1rem; font-weight: 700;
    cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); min-width: 90px;
}
.pitch-btn:hover { background: rgba(30,41,59,0.9); }
.pitch-btn.selected { background: #2563eb; border-color: #60a5fa; box-shadow: 0 0 15px #3b82f6; }

#pitch-zone {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    width: 200px; height: 300px; border: 3px solid rgba(255,255,255,0.8);
    display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr;
    background: rgba(59,130,246,0.1); cursor: crosshair; z-index: 90;
}
.pz-cell { border: 1px dashed rgba(255,255,255,0.3); pointer-events: none; }

#timing-gauge {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 250px; height: 250px; display: none; z-index: 100;
}
.tg-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; }
.tg-target { width: 80px; height: 80px; border: 4px solid #22c55e; background: rgba(34,197,94,0.3); }
.tg-good { width: 130px; height: 130px; border: 2px dashed #f59e0b; }
.tg-shrinker { width: 250px; height: 250px; border: 6px solid #fff; box-shadow: 0 0 15px #fff; }

/* ─── 공격(타자) UI ─── */
#bat-ui { display: none; }
#bat-cursor {
    position: absolute; width: 40px; height: 40px; border: 3px solid #f59e0b; border-radius: 50%;
    transform: translate(-50%, -50%); pointer-events: none; z-index: 100;
    box-shadow: 0 0 10px #f59e0b, inset 0 0 10px #f59e0b;
}
#bat-cursor::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 4px; height: 4px; background: #fff; border-radius: 50%; }

/* 하단 안내 */
#guide-msg {
    position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
    font-size: 1.5rem; font-weight: 700; color: #fff; text-shadow: 0 2px 5px #000;
    background: rgba(0,0,0,0.5); padding: 5px 20px; border-radius: 20px;
    pointer-events: none;
}
</style>
</head>
<body>

<!-- 렌더링 캔버스 -->
<canvas id="game-canvas"></canvas>

<div class="ui-layer">
    <!-- 모드 정보 -->
    <div id="mode-info">
        <div class="mi-title">Current Mode</div>
        <div class="mi-mode" id="mi-mode-text">OFFENSE</div>
    </div>

    <!-- 스코어보드 -->
    <div id="scoreboard">
        <div class="sb-team away">
            <span>AWAY</span> <div class="sb-score" id="score-away">0</div>
        </div>
        <div class="sb-center">
            <div class="sb-inning" id="inning-text">1회초</div>
            <div class="sb-count">
                <div class="cnt-group"><span class="cnt-lbl">B</span><div class="cnt-dots"><div class="dot b" id="b1"></div><div class="dot b" id="b2"></div><div class="dot b" id="b3"></div></div></div>
                <div class="cnt-group"><span class="cnt-lbl">S</span><div class="cnt-dots"><div class="dot s" id="s1"></div><div class="dot s" id="s2"></div></div></div>
                <div class="cnt-group"><span class="cnt-lbl">O</span><div class="cnt-dots"><div class="dot o" id="o1"></div><div class="dot o" id="o2"></div></div></div>
            </div>
        </div>
        <div class="sb-team home">
            <div class="sb-score" id="score-home">0</div> <span>DODO</span>
        </div>
    </div>

    <!-- 미니맵 -->
    <div id="minimap">
        <div class="base" id="base-1"></div>
        <div class="base" id="base-2"></div>
        <div class="base" id="base-3"></div>
        <div class="base" id="base-h"></div>
    </div>

    <!-- 수비(투수) UI -->
    <div id="pitch-ui" class="pointer-events-auto">
        <div id="pitch-zone">
            <div class="pz-cell"></div><div class="pz-cell"></div><div class="pz-cell"></div>
            <div class="pz-cell"></div><div class="pz-cell"></div><div class="pz-cell"></div>
            <div class="pz-cell"></div><div class="pz-cell"></div><div class="pz-cell"></div>
        </div>
        <div id="timing-gauge">
            <div class="tg-ring tg-good"></div>
            <div class="tg-ring tg-target"></div>
            <div class="tg-ring tg-shrinker" id="tg-shrink"></div>
        </div>
        <div id="pitch-controls">
            <button class="pitch-btn" data-pitch="4S">포심 패스트볼</button>
            <button class="pitch-btn" data-pitch="SL">슬라이더</button>
            <button class="pitch-btn" data-pitch="CU">커브</button>
            <button class="pitch-btn" data-pitch="CH">체인지업</button>
        </div>
    </div>

    <!-- 공격(타자) UI -->
    <div id="bat-ui" class="pointer-events-auto">
        <div id="bat-cursor"></div>
    </div>

    <div id="guide-msg"></div>
    <div id="center-msg"><div id="cm-main">PLAY BALL</div><div id="cm-sub" class="cm-sub"></div></div>
</div>

<script>
/**
 * DODO Baseball - 9 Inning Full Game
 * Architecture: Canvas 2D Rendering + Vanilla JS State Machine
 */

// ─── 게임 상태 관리 ───
const state = {
    inning: 1,
    half: 'top', // 'top' (AWAY 공격 = HOME 수비), 'bottom' (HOME 공격)
    awayScore: 0, homeScore: 0,
    strikes: 0, balls: 0, outs: 0,
    bases: [false, false, false], // 1B, 2B, 3B
    
    // 현재 모드 관련
    mode: 'TITLE', // TITLE, PITCHING, BATTING, FLYING, RESULT
    pitchPhase: 'SELECT', // SELECT, AIM, TIMING (수비 시)
    selectedPitch: null,
    target: { x: 0, y: 0 }, // 투구/타격 목표점 (-1 to 1)
    
    // 타격(공격) 시
    batReticle: { x: 0, y: 0 }, // 픽셀
    
    // 공 데이터
    ball: { active: false, startTime: 0, duration: 0, startX: 0, startY: 0, endX: 0, endY: 0, scale: 1, type: null, timingScore: 0 }
};

const PITCHES = {
    '4S': { min: 145, max: 155, drop: 0, curve: 0 },
    'SL': { min: 135, max: 142, drop: 20, curve: -40 }, // 우투수 기준 우타자 바깥쪽
    'CU': { min: 120, max: 130, drop: 60, curve: -15 },
    'CH': { min: 130, max: 138, drop: 30, curve: 30 }
};

// ─── HTML 엘리먼트 ───
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const ui = {
    pitch: document.getElementById('pitch-ui'),
    bat: document.getElementById('bat-ui'),
    batCursor: document.getElementById('bat-cursor'),
    pBtns: document.querySelectorAll('.pitch-btn'),
    pZone: document.getElementById('pitch-zone'),
    tGauge: document.getElementById('timing-gauge'),
    tShrink: document.getElementById('tg-shrink'),
    guide: document.getElementById('guide-msg'),
    msg: document.getElementById('center-msg'),
    msgMain: document.getElementById('cm-main'),
    msgSub: document.getElementById('cm-sub'),
    modeTxt: document.getElementById('mi-mode-text'),
    inningTxt: document.getElementById('inning-text')
};

// ─── 캔버스 리사이징 ───
let cx = 0, cy = 0; // Center X, Y
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cx = canvas.width / 2;
    cy = canvas.height / 2;
}
window.addEventListener('resize', resize);
resize();

// ─── 공통 유틸 ───
function showMessage(main, sub = '', duration = 2000, callback = null) {
    ui.msgMain.textContent = main;
    ui.msgSub.textContent = sub;
    ui.msg.classList.add('show');
    setTimeout(() => {
        ui.msg.classList.remove('show');
        if (callback) callback();
    }, duration);
}

function updateScoreboard() {
    document.getElementById('score-away').textContent = state.awayScore;
    document.getElementById('score-home').textContent = state.homeScore;
    ui.inningTxt.textContent = `${state.inning}회${state.half === 'top' ? '초' : '말'}`;
    
    // 카운트 점등
    for(let i=1; i<=3; i++) document.getElementById('b'+i).classList.toggle('lit', i <= state.balls);
    for(let i=1; i<=2; i++) document.getElementById('s'+i).classList.toggle('lit', i <= state.strikes);
    for(let i=1; i<=2; i++) document.getElementById('o'+i).classList.toggle('lit', i <= state.outs);
    
    // 미니맵 점등
    document.getElementById('base-1').classList.toggle('on', state.bases[0]);
    document.getElementById('base-2').classList.toggle('on', state.bases[1]);
    document.getElementById('base-3').classList.toggle('on', state.bases[2]);
    
    // 모드 텍스트 업데이트
    const isDefense = state.half === 'top'; // 유저는 홈팀. 초에는 수비(투수)
    ui.modeTxt.textContent = isDefense ? 'DEFENSE' : 'OFFENSE';
    ui.modeTxt.className = isDefense ? 'mi-mode defense' : 'mi-mode';
}

function startInning() {
    updateScoreboard();
    const isDefense = state.half === 'top';
    const modeText = isDefense ? "수비 (투수)" : "공격 (타자)";
    showMessage(`${state.inning}회 ${state.half === 'top' ? '초' : '말'}`, `DODO Team ${modeText}`, 2000, () => {
        startTurn();
    });
}

function advanceRunners(basesToAdvance) {
    let runs = 0;
    // 홈런 (4)
    if (basesToAdvance === 4) {
        runs = 1; // 타자 본인
        if(state.bases[2]) { runs++; state.bases[2] = false; }
        if(state.bases[1]) { runs++; state.bases[1] = false; }
        if(state.bases[0]) { runs++; state.bases[0] = false; }
    } else {
        // 기존 주자 이동
        for(let i=2; i>=0; i--) {
            if(state.bases[i]) {
                state.bases[i] = false;
                if(i + basesToAdvance >= 3) runs++;
                else state.bases[i + basesToAdvance] = true;
            }
        }
        // 타자 이동
        state.bases[basesToAdvance - 1] = true;
    }
    
    // 점수 합산
    if(runs > 0) {
        if(state.half === 'top') state.awayScore += runs;
        else state.homeScore += runs;
        return `+${runs} SCORE!`;
    }
    return '';
}

function handleAtBatResult(resultType) {
    let msg = '', sub = '';
    let isHit = false;
    
    switch(resultType) {
        case 'STRIKE':
            state.strikes++; msg = 'STRIKE';
            break;
        case 'BALL':
            state.balls++; msg = 'BALL';
            break;
        case 'FOUL':
            if(state.strikes < 2) state.strikes++;
            msg = 'FOUL';
            break;
        case 'HIT':
            isHit = true; msg = 'HIT!';
            sub = advanceRunners(1);
            break;
        case 'DOUBLE':
            isHit = true; msg = 'DOUBLE!';
            sub = advanceRunners(2);
            break;
        case 'HR':
            isHit = true; msg = 'HOME RUN!!';
            sub = advanceRunners(4);
            break;
        case 'OUT':
            state.outs++; msg = 'OUT!';
            break;
    }
    
    // 아웃 판정
    if (state.strikes >= 3) {
        state.outs++; state.strikes = 0; state.balls = 0;
        if(resultType === 'STRIKE') { msg = 'STRIKE OUT!'; sub = ''; }
    }
    if (state.balls >= 4) {
        state.strikes = 0; state.balls = 0;
        msg = 'WALK (볼넷)'; sub = advanceRunners(1);
    }
    if (isHit || resultType === 'OUT') {
        state.strikes = 0; state.balls = 0;
    }
    
    showMessage(msg, sub, 2500, () => {
        // 공수 교대 체크
        if (state.outs >= 3) {
            state.outs = 0; state.strikes = 0; state.balls = 0;
            state.bases = [false, false, false];
            
            if (state.half === 'top') {
                state.half = 'bottom';
                startInning();
            } else {
                state.inning++;
                state.half = 'top';
                if (state.inning > 9) {
                    endGame();
                } else {
                    startInning();
                }
            }
        } else {
            updateScoreboard();
            startTurn();
        }
    });
    updateScoreboard();
}

function endGame() {
    ui.pitch.style.display = 'none';
    ui.bat.style.display = 'none';
    let msg = "DRAW";
    if(state.homeScore > state.awayScore) msg = "DODO WIN!!";
    else if(state.homeScore < state.awayScore) msg = "DODO LOSE...";
    showMessage("GAME OVER", msg, 999999);
}

// ─── 렌더링 시스템 (Canvas 2D) ───
function drawField() {
    // 하늘
    const gradSky = ctx.createLinearGradient(0, 0, 0, cy);
    gradSky.addColorStop(0, '#0f172a'); gradSky.addColorStop(1, '#1e293b');
    ctx.fillStyle = gradSky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 잔디
    const gradGrass = ctx.createLinearGradient(0, cy, 0, canvas.height);
    gradGrass.addColorStop(0, '#166534'); gradGrass.addColorStop(1, '#14532d');
    ctx.fillStyle = gradGrass;
    ctx.fillRect(0, cy, canvas.width, canvas.height / 2);
    
    // 그리드 라인 (원근감)
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 2;
    for(let i=0; i<10; i++) {
        ctx.beginPath();
        ctx.moveTo(cx - 500 + i*100, cy);
        ctx.lineTo(cx - 1000 + i*200, canvas.height);
        ctx.stroke();
    }
    
    // 마운드 (흙)
    ctx.fillStyle = '#78350f'; // 갈색
    ctx.beginPath();
    ctx.ellipse(cx, cy + 50, 150, 40, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // 투수판
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - 20, cy + 45, 40, 8);
    
    // 홈플레이트 주변 흙
    ctx.beginPath();
    ctx.ellipse(cx, canvas.height + 50, 400, 200, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // 홈플레이트
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    const hy = canvas.height - 80;
    ctx.moveTo(cx, hy - 15);
    ctx.lineTo(cx + 20, hy - 15);
    ctx.lineTo(cx + 20, hy + 5);
    ctx.lineTo(cx, hy + 20);
    ctx.lineTo(cx - 20, hy + 5);
    ctx.lineTo(cx - 20, hy - 15);
    ctx.fill();
}

function drawCharacter(role) {
    const isDefense = state.half === 'top';
    
    // 수비(투수) 모드일 땐 유저가 투수이므로, 투수는 등 뒤에서(투명), 타자는 정면
    // 공격(타자) 모드일 땐 유저가 타자이므로, 투수는 정면, 타자는 등 뒤(투명)
    
    // 여기서는 기본 어깨뷰(타자/포수 뒤에서 투수를 바라봄)를 항상 유지합니다. (가장 리얼함)
    // 수비든 공격이든 시점은 고정하되 조작만 바꿈.
    
    // 1. 투수 그리기 (마운드)
    ctx.fillStyle = isDefense ? '#1d4ed8' : '#b91c1c'; // 유저(수비) 파란색, 유저(공격) 빨간색 -> 유니폼
    // 와인드업 애니메이션 모션 대충
    let py = cy + 5; // 투수 y위치
    ctx.beginPath();
    ctx.ellipse(cx, py, 15, 30, 0, 0, Math.PI * 2); // 몸통
    ctx.fill();
    ctx.fillStyle = '#fca5a5';
    ctx.beginPath();
    ctx.arc(cx, py - 40, 10, 0, Math.PI * 2); // 머리
    ctx.fill();
    
    // 2. 타자 그리기 (홈플레이트 좌측)
    ctx.fillStyle = isDefense ? '#b91c1c' : '#1d4ed8';
    let bx = cx - 50;
    let by = canvas.height - 120;
    ctx.beginPath();
    ctx.ellipse(bx, by, 30, 60, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fca5a5';
    ctx.beginPath();
    ctx.arc(bx, by - 80, 15, 0, Math.PI * 2);
    ctx.fill();
    // 배트
    ctx.strokeStyle = '#d97706'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx + 15, by - 40);
    ctx.lineTo(bx + 60, by - 120);
    ctx.stroke();
}

function drawBall() {
    if (!state.ball.active) return;
    
    const now = performance.now();
    let t = (now - state.ball.startTime) / state.ball.duration;
    if (t > 1) t = 1;
    
    // ease-in (다가올수록 빠름)
    const easeT = t * t * t;
    
    const curX = state.ball.startX + (state.ball.endX - state.ball.startX) * t + Math.sin(t * Math.PI) * state.ball.type.curve;
    const curY = state.ball.startY + (state.ball.endY - state.ball.startY) * t + Math.sin(t * Math.PI) * state.ball.type.drop;
    
    const scale = 0.2 + (easeT * 1.5);
    const radius = 10 * scale;
    
    // 공 그리기
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(curX, curY, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(curX - radius*0.3, curY, radius*0.7, -Math.PI/2, Math.PI/2);
    ctx.stroke();
    
    if (t >= 1) {
        state.ball.active = false;
        resolvePitch(curX, curY); // 투구 완료 처리
    }
}

// 메인 렌더 루프
function gameLoop() {
    drawField();
    drawCharacter();
    drawBall();
    
    // 스트라이크 존 렌더링 (참고용)
    if (state.mode === 'PITCHING' || state.mode === 'BATTING') {
        const zWidth = 160, zHeight = 220;
        const zx = cx - zWidth/2, zy = canvas.height - 250 - zHeight/2;
        ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
        ctx.strokeRect(zx, zy, zWidth, zHeight);
    }
    
    requestAnimationFrame(gameLoop);
}

// ─── 게임 로직: 턴 시작 ───
function startTurn() {
    const isDefense = state.half === 'top';
    
    if (isDefense) {
        // 유저 수비 (투수)
        state.mode = 'PITCHING';
        state.pitchPhase = 'SELECT';
        ui.bat.style.display = 'none';
        ui.pitch.style.display = 'block';
        ui.guide.textContent = "구종을 선택하세요";
        ui.pZone.style.display = 'none';
        ui.tGauge.style.display = 'none';
        
        ui.pBtns.forEach(b => b.classList.remove('selected'));
        ui.pBtns.forEach(btn => {
            btn.onclick = () => {
                if (state.pitchPhase !== 'SELECT') return;
                ui.pBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                state.selectedPitch = PITCHES[btn.dataset.pitch];
                state.pitchPhase = 'AIM';
                ui.guide.textContent = "코스를 지정하세요 (클릭)";
                ui.pZone.style.display = 'grid';
            };
        });
        
        ui.pZone.onpointerdown = (e) => {
            if (state.pitchPhase !== 'AIM') return;
            const rect = ui.pZone.getBoundingClientRect();
            // -1 to 1 mapped to strike zone bounds
            state.target.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            state.target.y = ((e.clientY - rect.top) / rect.height) * 2 - 1;
            
            state.pitchPhase = 'TIMING';
            ui.pZone.style.display = 'none';
            ui.guide.textContent = "원형 게이지가 녹색일 때 터치!";
            startPitchTimingGauge();
        };
        
    } else {
        // 유저 공격 (타자)
        state.mode = 'BATTING';
        ui.pitch.style.display = 'none';
        ui.bat.style.display = 'block';
        ui.guide.textContent = "마우스로 조준하고 클릭하여 스윙!";
        
        // 타격 커서 마우스 이동
        window.onpointermove = (e) => {
            if (state.mode !== 'BATTING' && state.mode !== 'FLYING') return;
            state.batReticle.x = e.clientX;
            state.batReticle.y = e.clientY;
            ui.batCursor.style.left = e.clientX + 'px';
            ui.batCursor.style.top = e.clientY + 'px';
        };
        
        // AI가 투구함 (1~2초 후)
        setTimeout(() => {
            const pitchKeys = Object.keys(PITCHES);
            state.selectedPitch = PITCHES[pitchKeys[Math.floor(Math.random() * pitchKeys.length)]];
            // 랜덤 타겟 (존 근처)
            state.target.x = (Math.random() - 0.5) * 2.5; 
            state.target.y = (Math.random() - 0.5) * 2.5;
            state.ball.timingScore = Math.random() * 0.5 + 0.5; // AI 투구 품질 (0.5 ~ 1)
            
            ui.guide.textContent = "투구 시작!";
            firePitch();
        }, 1500);
        
        // 유저 스윙
        window.onpointerdown = (e) => {
            if (state.mode !== 'FLYING') return; // 공 날아올 때만 스윙 가능
            state.mode = 'SWINGED';
            ui.guide.textContent = "SWING!";
            
            // 공 위치와 배트 커서 위치 비교
            const bx = parseFloat(ui.batCursor.style.left) || 0;
            const by = parseFloat(ui.batCursor.style.top) || 0;
            
            // 현재 공 픽셀 위치 계산
            const now = performance.now();
            let t = (now - state.ball.startTime) / state.ball.duration;
            if (t > 1) t = 1;
            const curX = state.ball.startX + (state.ball.endX - state.ball.startX) * t + Math.sin(t * Math.PI) * state.selectedPitch.curve;
            const curY = state.ball.startY + (state.ball.endY - state.ball.startY) * t + Math.sin(t * Math.PI) * state.selectedPitch.drop;
            
            const dist = Math.hypot(bx - curX, by - curY);
            
            // 거리와 타이밍(t)로 타격 판정
            if (t > 0.8 && t < 1.1) {
                // 타이밍 맞음
                if (dist < 40) {
                    state.ball.active = false;
                    handleAtBatResult(Math.random() > 0.8 ? 'HR' : (Math.random() > 0.5 ? 'DOUBLE' : 'HIT'));
                } else if (dist < 80) {
                    state.ball.active = false;
                    handleAtBatResult('FOUL');
                } else {
                    state.ball.active = false;
                    handleAtBatResult('STRIKE'); // 헛스윙
                }
            } else {
                // 타이밍 안맞음
                state.ball.active = false;
                handleAtBatResult('STRIKE'); // 헛스윙
            }
        };
    }
}

// ─── 투수 타이밍 미니게임 (수비 시) ───
let pitchAnimReq;
function startPitchTimingGauge() {
    ui.tGauge.style.display = 'block';
    let size = 250;
    let shrinkSpeed = 5;
    
    function anim() {
        if (state.pitchPhase !== 'TIMING') return;
        size -= shrinkSpeed;
        if (size < 40) size = 250;
        ui.tShrink.style.width = size + 'px';
        ui.tShrink.style.height = size + 'px';
        pitchAnimReq = requestAnimationFrame(anim);
    }
    anim();
    
    window.onpointerdown = () => {
        if (state.pitchPhase !== 'TIMING') return;
        cancelAnimationFrame(pitchAnimReq);
        ui.tGauge.style.display = 'none';
        
        let score = 0;
        if (size >= 70 && size <= 90) score = 1.0;
        else if (size >= 50 && size <= 110) score = 0.6;
        else score = 0.2;
        
        state.ball.timingScore = score;
        firePitch();
    };
}

// ─── 투구 실행 로직 ───
function firePitch() {
    state.mode = 'FLYING';
    ui.guide.textContent = "";
    if(state.half === 'top') window.onpointerdown = null; // 수비시 터치 방지
    
    const spd = Math.floor(state.selectedPitch.min + (state.selectedPitch.max - state.selectedPitch.min) * state.ball.timingScore);
    
    // 계산식 (Pixel mapping)
    const startX = cx; 
    const startY = cy + 40; // 투수 손 위치
    
    const zWidth = 160, zHeight = 220;
    const zx = cx - zWidth/2, zy = canvas.height - 250 - zHeight/2;
    
    // 에러 범위를 타이밍 스코어에 비례하게 줌
    const errX = (1 - state.ball.timingScore) * (Math.random()-0.5) * 150;
    const errY = (1 - state.ball.timingScore) * (Math.random()-0.5) * 150;
    
    const endX = zx + zWidth/2 + (state.target.x * zWidth/2) + errX;
    const endY = zy + zHeight/2 + (state.target.y * zHeight/2) + errY;
    
    state.ball = {
        active: true,
        startTime: performance.now(),
        duration: 160 / spd * 700,
        startX, startY, endX, endY,
        type: state.selectedPitch,
        timingScore: state.ball.timingScore
    };
}

// ─── 투구 도달 후 결과 처리 (수비 및 루킹 판정) ───
function resolvePitch(endX, endY) {
    if (state.mode === 'SWINGED') return; // 이미 공격자가 스윙해서 결과가 난 경우 무시
    
    // 스트라이크 존 픽셀
    const zWidth = 160, zHeight = 220;
    const zLeft = cx - zWidth/2, zRight = cx + zWidth/2;
    const zTop = canvas.height - 250 - zHeight/2, zBottom = canvas.height - 250 + zHeight/2;
    
    const inZone = endX > zLeft && endX < zRight && endY > zTop && endY < zBottom;
    
    if (state.half === 'top') {
        // AI 타자의 판정 (수비 모드)
        const swingProb = inZone ? 0.7 : 0.2;
        if (Math.random() < swingProb) {
            // AI가 스윙함
            const hitProb = inZone ? (0.6 - state.ball.timingScore * 0.3) : 0.1; 
            // 퍼펙트 타이밍이면 안타 맞을 확률 감소
            if (Math.random() < hitProb) {
                handleAtBatResult(Math.random() > 0.8 ? 'HR' : 'HIT');
            } else {
                handleAtBatResult('STRIKE'); // 헛스윙
            }
        } else {
            // AI가 지켜봄
            handleAtBatResult(inZone ? 'STRIKE' : 'BALL');
        }
    } else {
        // 유저 공격 모드인데 가만히 있었음 (루킹)
        handleAtBatResult(inZone ? 'STRIKE' : 'BALL');
    }
}

// 게임 시작
showMessage("DODO Baseball", "9 Inning Full Game", 2000, () => {
    startInning();
    requestAnimationFrame(gameLoop);
});

</script>
