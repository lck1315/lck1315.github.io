<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DODO Baseball | 3D 투구 물리 게임</title>
<meta name="description" content="마그누스 효과, 실시간 물리 엔진 기반 3D 야구 투구 게임. 포심, 슬라이더, 커브 등 8가지 구종 지원.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
<style>
/* ─── Reset & Base ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg:        #0a0e1a;
    --surface:   #121828;
    --card:      #1a2235;
    --border:    rgba(255,255,255,0.08);
    --primary:   #3b82f6;
    --accent:    #60a5fa;
    --gold:      #f59e0b;
    --red:       #ef4444;
    --green:     #22c55e;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --strike-z:  rgba(59,130,246,0.25);
    --glow:      0 0 20px rgba(59,130,246,0.4);
}
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Outfit', 'Noto Sans KR', sans-serif; color: var(--text); }

/* ─── Layout ────────────────────────────────────────────────── */
#game-wrapper {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

/* ─── Top Header ─────────────────────────────────────────────── */
#game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    flex-shrink: 0;
}
.game-logo {
    font-size: 1.3rem;
    font-weight: 900;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
}
.game-logo span { font-weight: 300; }

.score-board {
    display: flex;
    gap: 20px;
    align-items: center;
    font-size: 0.85rem;
}
.score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}
.score-label { font-size: 0.65rem; color: var(--muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.score-value { font-size: 1.1rem; font-weight: 800; color: var(--text); }
.score-value.gold { color: var(--gold); }
.score-value.red  { color: var(--red); }
.score-value.green{ color: var(--green); }

.header-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
    transition: 0.2s;
}
.header-btn:hover { background: var(--primary); border-color: var(--primary); }

/* ─── Main Area ──────────────────────────────────────────────── */
#main-area {
    display: flex;
    flex: 1;
    overflow: hidden;
}

/* ─── 3D Canvas ──────────────────────────────────────────────── */
#canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
}
#three-canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* ─── Overlays ───────────────────────────────────────────────── */
#pitch-result-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    text-align: center;
    pointer-events: none;
    transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 50;
}
#pitch-result-overlay.show {
    transform: translate(-50%, -50%) scale(1);
}
.result-text {
    font-size: 3.5rem;
    font-weight: 900;
    text-shadow: 0 0 30px currentColor;
    letter-spacing: 2px;
}
.result-sub {
    font-size: 1.1rem;
    color: rgba(255,255,255,0.7);
    margin-top: 6px;
}

/* ─── Strike Zone HUD (캔버스 위에 오버레이) ─────────────────── */
#strikezone-hud {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: none;
}
.sz-title {
    font-size: 0.65rem;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
}
#sz-canvas {
    border: 2px solid rgba(96,165,250,0.5);
    border-radius: 4px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(4px);
}

/* ─── Pitch Trail Info ───────────────────────────────────────── */
#pitch-info-hud {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(10,14,26,0.8);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.75rem;
    pointer-events: none;
    min-width: 160px;
    backdrop-filter: blur(8px);
}
.info-row { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 3px; }
.info-key { color: var(--muted); }
.info-val { font-weight: 700; color: var(--accent); }

/* ─── Right Panel ────────────────────────────────────────────── */
#right-panel {
    width: 280px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow-y: auto;
    flex-shrink: 0;
}
.panel-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
}
.panel-title {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
}

/* ─── Pitch Selector ─────────────────────────────────────────── */
#pitch-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}
.pitch-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 700;
    text-align: center;
    transition: 0.15s;
    position: relative;
    overflow: hidden;
}
.pitch-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.pitch-btn.active {
    background: linear-gradient(135deg, var(--primary), #7c3aed);
    border-color: var(--accent);
    box-shadow: 0 0 14px rgba(59,130,246,0.4);
}
.pitch-btn .pitch-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
    vertical-align: middle;
}
.pitch-spd { font-size: 0.6rem; color: var(--muted); margin-top: 1px; }
.pitch-btn.active .pitch-spd { color: rgba(255,255,255,0.7); }

/* ─── Aiming (Catcher View) ──────────────────────────────────── */
#aim-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}
#aim-canvas-wrap {
    position: relative;
    cursor: crosshair;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 2px var(--border);
}
#aim-canvas { display: block; }
.aim-tip { font-size: 0.65rem; color: var(--muted); text-align: center; }

/* ─── Power / Timing Gauge ───────────────────────────────────── */
#gauge-area { display: flex; flex-direction: column; gap: 10px; }
.gauge-row { display: flex; align-items: center; gap: 10px; }
.gauge-label { font-size: 0.7rem; color: var(--muted); width: 40px; }
.gauge-track {
    flex: 1;
    height: 10px;
    background: var(--card);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
}
.gauge-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 0.05s linear;
    background: linear-gradient(90deg, var(--primary), var(--accent));
}
.gauge-fill.timing {
    background: linear-gradient(90deg, #f59e0b, #ef4444);
}
.gauge-val {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--accent);
    width: 32px;
    text-align: right;
}

/* ─── Pitch Button ───────────────────────────────────────────── */
#btn-pitch-container { padding: 12px 16px; }
#btn-pitch {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--primary), #7c3aed);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
    transition: 0.2s;
    box-shadow: var(--glow);
}
#btn-pitch:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(59,130,246,0.6); }
#btn-pitch:active { transform: translateY(0); }
#btn-pitch:disabled {
    background: var(--card);
    color: var(--muted);
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}

/* ─── Count Indicator ────────────────────────────────────────── */
#count-display {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 12px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
}
.count-group { text-align: center; }
.count-label { font-size: 0.6rem; color: var(--muted); font-weight: 700; letter-spacing: 1px; }
.count-dots { display: flex; gap: 4px; margin-top: 4px; justify-content: center; }
.count-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid var(--muted);
    background: transparent;
    transition: 0.2s;
}
.count-dot.active.strike { background: var(--red); border-color: var(--red); }
.count-dot.active.ball   { background: var(--green); border-color: var(--green); }

/* ─── Camera Controls ────────────────────────────────────────── */
#camera-controls {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
}
.cam-btn {
    flex: 1;
    min-width: 60px;
    padding: 6px 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 0.65rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    transition: 0.15s;
}
.cam-btn:hover, .cam-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ─── Pitch Log ──────────────────────────────────────────────── */
#pitch-log {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
}
.log-entry {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 0.72rem;
}
.log-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.log-name { flex: 1; color: var(--text); }
.log-speed { color: var(--muted); }
.log-result { font-weight: 700; width: 40px; text-align: right; }

/* ─── Physics Info Toggle ─────────────────────────────────────── */
#physics-panel {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
}
.physics-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    margin-bottom: 4px;
    color: var(--muted);
}
.physics-row span:last-child { color: var(--accent); font-weight: 700; }

/* ─── Loading Screen ──────────────────────────────────────────── */
#loading-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    gap: 20px;
    transition: opacity 0.5s;
}
#loading-screen.hide { opacity: 0; pointer-events: none; }
.loading-logo {
    font-size: 3rem;
    font-weight: 900;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.loading-bar-wrap { width: 220px; height: 4px; background: var(--card); border-radius: 4px; overflow: hidden; }
.loading-bar { height: 100%; background: linear-gradient(90deg, #3b82f6, #a78bfa); width: 0%; transition: width 0.3s; border-radius: 4px; }
.loading-text { font-size: 0.85rem; color: var(--muted); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Mobile */
@media (max-width: 700px) {
    #right-panel { width: 220px; }
    .result-text { font-size: 2rem; }
}
</style>
</head>
<body>

<!-- ─── Loading ─────────────────────────────────────────────── -->
<div id="loading-screen">
    <div class="loading-logo">⚾ DODO Baseball</div>
    <div>
        <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
    </div>
    <div class="loading-text" id="loading-text">3D 스타디움 로딩 중...</div>
</div>

<!-- ─── Game Wrapper ─────────────────────────────────────────── -->
<div id="game-wrapper">

    <!-- Header -->
    <div id="game-header">
        <div class="game-logo">⚾ DODO <span>Baseball</span></div>
        <div class="score-board">
            <div class="score-item">
                <div class="score-label">이닝</div>
                <div class="score-value gold" id="sc-inning">1</div>
            </div>
            <div class="score-item">
                <div class="score-label">홈</div>
                <div class="score-value green" id="sc-home">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">원정</div>
                <div class="score-value red" id="sc-away">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">아웃</div>
                <div class="score-value" id="sc-out">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">피치</div>
                <div class="score-value" id="sc-pitches">0</div>
            </div>
        </div>
        <div style="display:flex;gap:8px;">
            <button class="header-btn" id="btn-reset-game"><i class="fa-solid fa-rotate-right"></i> 리셋</button>
            <button class="header-btn" onclick="window.location.href='game.html'"><i class="fa-solid fa-arrow-left"></i> 돌아가기</button>
        </div>
    </div>

    <!-- Main -->
    <div id="main-area">

        <!-- 3D Canvas Area -->
        <div id="canvas-area">
            <canvas id="three-canvas"></canvas>

            <!-- Pitch Info HUD -->
            <div id="pitch-info-hud" style="display:none;">
                <div class="info-row"><span class="info-key">구종</span><span class="info-val" id="hud-type">-</span></div>
                <div class="info-row"><span class="info-key">구속</span><span class="info-val" id="hud-speed">-</span></div>
                <div class="info-row"><span class="info-key">회전수</span><span class="info-val" id="hud-rpm">-</span></div>
                <div class="info-row"><span class="info-key">이동시간</span><span class="info-val" id="hud-time">-</span></div>
                <div class="info-row"><span class="info-key">무브먼트</span><span class="info-val" id="hud-break">-</span></div>
            </div>

            <!-- Result Overlay -->
            <div id="pitch-result-overlay">
                <div class="result-text" id="result-text">STRIKE!</div>
                <div class="result-sub" id="result-sub">완벽한 코너 워크</div>
            </div>

            <!-- Strike Zone HUD (mini) -->
            <div id="strikezone-hud">
                <div class="sz-title">홈플레이트 뷰</div>
                <canvas id="sz-canvas" width="120" height="100"></canvas>
            </div>
        </div>

        <!-- Right Panel -->
        <div id="right-panel">

            <!-- Count -->
            <div id="count-display">
                <div class="count-group">
                    <div class="count-label">BALL</div>
                    <div class="count-dots" id="ball-dots">
                        <div class="count-dot ball" id="ball-0"></div>
                        <div class="count-dot ball" id="ball-1"></div>
                        <div class="count-dot ball" id="ball-2"></div>
                    </div>
                </div>
                <div class="count-group" style="font-size:1.5rem; color:var(--gold); font-weight:900; align-self:center;">⚾</div>
                <div class="count-group">
                    <div class="count-label">STRIKE</div>
                    <div class="count-dots" id="strike-dots">
                        <div class="count-dot strike" id="strike-0"></div>
                        <div class="count-dot strike" id="strike-1"></div>
                    </div>
                </div>
            </div>

            <!-- Camera Controls -->
            <div id="camera-controls">
                <button class="cam-btn active" data-cam="pitcher" onclick="setCamera('pitcher',this)">투수뷰</button>
                <button class="cam-btn" data-cam="catcher" onclick="setCamera('catcher',this)">포수뷰</button>
                <button class="cam-btn" data-cam="side" onclick="setCamera('side',this)">사이드</button>
                <button class="cam-btn" data-cam="top" onclick="setCamera('top',this)">탑뷰</button>
            </div>

            <!-- Pitch Selection -->
            <div class="panel-section">
                <div class="panel-title"><i class="fa-solid fa-hand-fist"></i> 구종 선택</div>
                <div id="pitch-grid"></div>
            </div>

            <!-- Aim -->
            <div class="panel-section">
                <div class="panel-title"><i class="fa-solid fa-crosshairs"></i> 스트라이크존 조준</div>
                <div id="aim-area">
                    <div id="aim-canvas-wrap">
                        <canvas id="aim-canvas" width="200" height="160"></canvas>
                    </div>
                    <div class="aim-tip">캔버스를 클릭하여 목표 지점 설정</div>
                </div>
            </div>

            <!-- Gauges -->
            <div class="panel-section">
                <div class="panel-title"><i class="fa-solid fa-gauge-high"></i> 파워 &amp; 타이밍</div>
                <div id="gauge-area">
                    <div class="gauge-row">
                        <span class="gauge-label">파워</span>
                        <div class="gauge-track">
                            <div class="gauge-fill" id="power-fill" style="width:80%"></div>
                        </div>
                        <span class="gauge-val" id="power-val">80%</span>
                    </div>
                    <div class="gauge-row">
                        <span class="gauge-label">타이밍</span>
                        <div class="gauge-track">
                            <div class="gauge-fill timing" id="timing-fill" style="width:0%"></div>
                        </div>
                        <span class="gauge-val" id="timing-val">-</span>
                    </div>
                    <input type="range" id="power-slider" min="60" max="100" value="80"
                        style="width:100%;accent-color:var(--primary);margin-top:4px;">
                </div>
            </div>

            <!-- Pitch Button -->
            <div id="btn-pitch-container">
                <button id="btn-pitch">⚾ 투구!</button>
            </div>

            <!-- Physics Info -->
            <div id="physics-panel">
                <div class="panel-title" style="margin-bottom:8px;"><i class="fa-solid fa-atom"></i> 실시간 물리</div>
                <div class="physics-row"><span>항력(Cd)</span><span id="phys-cd">-</span></div>
                <div class="physics-row"><span>마그누스(CL)</span><span id="phys-cl">-</span></div>
                <div class="physics-row"><span>공기밀도(ρ)</span><span id="phys-rho">1.204 kg/m³</span></div>
                <div class="physics-row"><span>중력(g)</span><span>9.807 m/s²</span></div>
            </div>

            <!-- Pitch Log -->
            <div class="panel-section" style="border-bottom:none; padding-bottom:4px;">
                <div class="panel-title"><i class="fa-solid fa-list"></i> 투구 기록</div>
            </div>
            <div id="pitch-log"></div>

        </div><!-- /right-panel -->
    </div><!-- /main-area -->
</div><!-- /game-wrapper -->

<script>
// ══════════════════════════════════════════════════════════════════
//  DODO Baseball - Main Game Engine
//  Three.js 기반 3D 야구 물리 게임
// ══════════════════════════════════════════════════════════════════

'use strict';

// ── 전역 상태 ────────────────────────────────────────────────────
const STATE = {
    balls: 0,
    strikes: 0,
    outs: 0,
    inning: 1,
    homeScore: 0,
    awayScore: 0,
    totalPitches: 0,
    isThrowing: false,
    selectedPitch: 'fourseam',
    aimX: 0, aimY: 0,      // 정규화 -1~1
    power: 80,
    timingScore: 0,
    camera: 'pitcher',
    lastResult: null,
};

// ── 구종 데이터 (Worker와 동기화) ───────────────────────────────
const PITCH_SPECS = {
    fourseam:    { name:'포심', name_en:'4-Seam', speedKmh:[148,158], color:'#FF4444', Cd:0.35, CL_base:0.23 },
    twoseam:     { name:'투심', name_en:'Sinker',  speedKmh:[143,153], color:'#FF7700', Cd:0.36, CL_base:0.20 },
    cutter:      { name:'커터', name_en:'Cutter',  speedKmh:[138,148], color:'#FF9900', Cd:0.35, CL_base:0.18 },
    curveball:   { name:'커브', name_en:'Curve',   speedKmh:[118,130], color:'#4488FF', Cd:0.38, CL_base:0.30 },

// ── Web Worker ───────────────────────────────────────────────────
function initWorker() {
    try {
        physicsWorker = new Worker('baseball-physics.worker.js');
        physicsWorker.onmessage = onWorkerMessage;
        physicsWorker.onerror = (e) => {
            console.warn('Worker error, falling back to main thread physics:', e);
            physicsWorker = null;
        };
    } catch(e) {
        console.warn('Web Worker not available, using main thread physics');
        physicsWorker = null;
    }
}

function onWorkerMessage(e) {
    const { cmd, payload, id } = e.data;
    if (cmd === 'result' && id === pendingPitchId) {
        startBallAnimation(payload);
    }
}

function requestPhysicsSimulation(pitchType, options) {
    pendingPitchId++;
    const id = pendingPitchId;

    if (physicsWorker) {
        physicsWorker.postMessage({ cmd: 'simulate', payload: { pitchType, options, id } });
    } else {
        // Fallback: run inline (simplified)
        const result = simulatePitchInline(pitchType, options);
        setTimeout(() => startBallAnimation(result), 0);
    }
}

// ── Inline physics fallback (simplified) ─────────────────────────
function simulatePitchInline(pitchType, options = {}) {
    const spec = PITCH_SPECS[pitchType];
    const speedKmh = spec.speedKmh[0] + Math.random() * (spec.speedKmh[1] - spec.speedKmh[0]);
    const speedMs = speedKmh / 3.6;
    const HOME_Z = 18.39, REL_H = 1.9;

    const AXIS_MAP = {
        fourseam:    { x:0,    y:0, z:1.0  },
        twoseam:     { x:0.2,  y:0, z:0.98 },
        cutter:      { x:-0.3, y:0, z:0.95 },
        curveball:   { x:0,    y:0, z:-1.0 },
        slider:      { x:-0.7, y:0.1, z:0.7 },
        sweeper:     { x:-1.0, y:0, z:0.2  },
        changeup:    { x:0.15, y:0, z:0.98 },
        splitter:    { x:0,    y:0, z:-0.5 },
        knuckleball: { x:0,    y:0, z:0    },
    };
    const RPM_MAP = {
        fourseam:[2200,2600], twoseam:[1900,2200], cutter:[2100,2500],
        curveball:[2400,3000], slider:[2200,2700], sweeper:[2500,3000],
        changeup:[1400,1800], splitter:[900,1300], knuckleball:[25,75],
    };

    const ax = AXIS_MAP[pitchType] || AXIS_MAP.fourseam;
    const rpmRange = RPM_MAP[pitchType] || [1500,2000];
    const rpm = rpmRange[0] + Math.random() * (rpmRange[1]-rpmRange[0]);
    const omega = (rpm * 2 * Math.PI) / 60;

    const g=-9.80665, rho=1.2041, A=0.004268, m=0.14175, R=0.03685;
    const Cd=spec.Cd, CL_base=spec.CL_base;
    const dt = 1/240;
    const tX=options.targetX??0, tY=options.targetY??0.65;
    const relX=-0.35, relY=REL_H, relZ=HOME_Z;

    const dirLen = Math.sqrt((tX-relX)**2+(tY-relY)**2+relZ**2);
    let vel = { x:(tX-relX)/dirLen*speedMs, y:(tY-relY)/dirLen*speedMs, z:-speedMs/dirLen*speedMs };
    vel.z = -speedMs * 0.99;
    vel.x = (tX-relX)/relZ * speedMs;
    vel.y = (tY-relY)/relZ * speedMs;

    let pos = {x:relX, y:relY, z:relZ};
    const axLen = Math.sqrt(ax.x**2+ax.y**2+ax.z**2)||1;
    const axN = {x:ax.x/axLen, y:ax.y/axLen, z:ax.z/axLen};

    const traj = [];
    let t=0;
    const maxT = (relZ/speedMs)*2.2;

    let kDx=0, kDy=0;

    while(pos.z > -0.2 && t < maxT) {
        const v = Math.sqrt(vel.x**2+vel.y**2+vel.z**2);
        const v2=v*v;
        const vhx=vel.x/v, vhy=vel.y/v, vhz=vel.z/v;

        // Gravity
        const fgY = g*m;

        // Drag
        let cd=Cd;
        if(pitchType==='knuckleball') {
            kDx+=(Math.random()-0.5)*1.5*dt;
            kDy+=(Math.random()-0.5)*1.2*dt;
            kDx=Math.max(-0.8,Math.min(0.8,kDx));
            kDy=Math.max(-0.5,Math.min(0.5,kDy));
            cd=Cd+Math.sin(t*8.5)*0.12+Math.cos(t*5.3)*0.08;
        }
        const fd=-0.5*rho*v2*A*cd;
        const fdX=fd*vhx, fdY=fd*vhy, fdZ=fd*vhz;

        // Magnus
        const spinRatio=(omega*R)/v;
        let CL=CL_base*Math.sqrt(Math.min(spinRatio/0.25,1.0));
        const crossX=axN.y*vhz-axN.z*vhy;
        const crossY=axN.z*vhx-axN.x*vhz;
        const crossZ=axN.x*vhy-axN.y*vhx;
        const fmMag=0.5*rho*v2*A*CL;
        let fmX=fmMag*crossX, fmY=fmMag*crossY, fmZ=fmMag*crossZ;
        if(pitchType==='knuckleball'){fmX+=kDx*0.8; fmY+=kDy*0.6;}

        // Integrate
        vel.x += (fdX+fmX)/m*dt;
        vel.y += (fgY+fdY+fmY)/m*dt;
        vel.z += (fdZ+fmZ)/m*dt;
        pos.x += vel.x*dt;
        pos.y += vel.y*dt;
        pos.z += vel.z*dt;

        if(Math.round(t/dt)%4===0) traj.push({x:pos.x,y:pos.y,z:pos.z,t,speedKmh:v*3.6});
        t+=dt;
    }

    return { trajectory:traj, speedKmh, rpm, finalX:pos.x, finalY:pos.y, pitchType, travelTime:t };
}

function initThree() {

    // Renderer
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });

    renderer.setSize(area.clientWidth, area.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    scene.background = new THREE.Color(0x0a0e1a);
    scene.fog = new THREE.FogExp2(0x0a0e1a, 0.006);

    // Camera
    camera = new THREE.PerspectiveCamera(60, area.clientWidth / area.clientHeight, 0.01, 300);

    // Lights
    ambientLight = new THREE.AmbientLight(0xffffff, 0.4);

    sunLight.shadow.camera.left = -40;
    sunLight.shadow.camera.right = 40;
    sunLight.shadow.camera.top = 40;
    sunLight.shadow.camera.bottom = -40;

function clearTrail() {
    if (trailLine) { scene.remove(trailLine); trailLine = null; }

function addTrailPoint(pos, color) {
    trailPoints.push(new THREE.Vector3(pos.x, pos.y, pos.z));
    if (trailPoints.length > 80) trailPoints.shift();

    if (trailLine) scene.remove(trailLine);

    const geo = new THREE.BufferGeometry().setFromPoints(trailPoints);
    const mat = new THREE.LineBasicMaterial({
        color: new THREE.Color(color || '#88BBFF'),
        opacity: 0.7,
        transparent: true,
    });
    trailLine = new THREE.Line(geo, mat);
    scene.add(trailLine);
}

// ─── Particle system for dust ────────────────────────────────────
let dustParticles = null;
function createDustEffect(pos) {
    if (dustParticles) { scene.remove(dustParticles); dustParticles = null; }
    const count = 80;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const velocities = [];
    for (let i = 0; i < count; i++) {
        positions[i*3]   = pos.x + (Math.random()-0.5)*0.2;
        positions[i*3+1] = pos.y;
        positions[i*3+2] = pos.z + (Math.random()-0.5)*0.2;
        velocities.push({
            x: (Math.random()-0.5)*0.04,
            y:  Math.random()*0.05 + 0.01,
            z: (Math.random()-0.5)*0.04,
        });
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color: 0x8B6543, size: 0.04, transparent: true, opacity: 0.8 });
    dustParticles = new THREE.Points(geo, mat);
    dustParticles._vels = velocities;
    dustParticles._life = 1.0;
    scene.add(dustParticles);
}

let dustClock = 0;
function updateDust(dt) {
    if (!dustParticles) return;
    dustParticles._life -= dt * 1.2;
    if (dustParticles._life <= 0) { scene.remove(dustParticles); dustParticles = null; return; }
    const pos = dustParticles.geometry.attributes.position.array;
    dustParticles._vels.forEach((v, i) => {
        v.y -= 0.002;
        pos[i*3]   += v.x;
        pos[i*3+1] += Math.max(v.y, 0);
        pos[i*3+2] += v.z;
    });
    dustParticles.material.opacity = dustParticles._life * 0.8;
    dustParticles.geometry.attributes.position.needsUpdate = true;
}

// ══════════════════════════════════════════════════════════════════
//  CAMERA
// ══════════════════════════════════════════════════════════════════
const CAMERA_PRESETS = {
    pitcher: { pos: [0.0, 2.5, 22.5], look: [0, 0.8, 0], fov: 55 },
    catcher: { pos: [0.3, 1.4, -2.5], look: [0, 1.0, 18], fov: 65 },
    side:    { pos: [20, 4.0, 8],     look: [0, 1.2, 8],  fov: 50 },
    top:     { pos: [0, 25, 8],       look: [0, 0, 8],    fov: 60 },
};

function setCameraPosition(name) {
    const p = CAMERA_PRESETS[name];
    if (!p) return;
    camera.position.set(...p.pos);
    camera.lookAt(...p.look);
    camera.fov = p.fov;
    camera.updateProjectionMatrix();
}

function setCamera(name, btnEl) {
    STATE.camera = name;
    setCameraPosition(name);
    document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');
}

// ── Smooth camera transition ─────────────────────────────────────
let camTarget = null;
function transitionCamera(name) {
    const p = CAMERA_PRESETS[name];
    camTarget = {
        pos: new THREE.Vector3(...p.pos),
        look: new THREE.Vector3(...p.look),
        fov: p.fov,
        t: 0,
        fromPos: camera.position.clone(),
        fromFov: camera.fov,
    };
}

// ══════════════════════════════════════════════════════════════════
//  PITCH ANIMATION
// ══════════════════════════════════════════════════════════════════
function startBallAnimation(data) {
    pitchData = data;
    ballT = 0;
    ballAnimating = true;
    STATE.isThrowing = true;

    const spec = PITCH_SPECS[data.pitchType] || PITCH_SPECS.fourseam;
    clearTrail();
    createBall(spec.color);

    // Update HUD
    const hud = document.getElementById('pitch-info-hud');
    hud.style.display = 'block';
    document.getElementById('hud-type').textContent = spec.name;
    document.getElementById('hud-speed').textContent = data.speedKmh.toFixed(1) + ' km/h';
    document.getElementById('hud-rpm').textContent = Math.round(data.rpm) + ' RPM';
    document.getElementById('hud-time').textContent = (data.travelTime * 1000).toFixed(0) + ' ms';

    document.getElementById('phys-cd').textContent = spec.Cd.toFixed(3);
    document.getElementById('phys-cl').textContent = spec.CL_base.toFixed(3);

    // Dust at mound
    createDustEffect({ x: -0.2, y: 0.25, z: 18.0 });

    // Pitcher arm animation
    animatePitcherThrow();
}

let pitcherArmAnim = 0;
function animatePitcherThrow() {
    pitcherArmAnim = 1.0;
}

function updateBallAnimation(dt) {
    if (!ballAnimating || !pitchData || !ballMesh) return;

    const traj = pitchData.trajectory;
    if (!traj || traj.length === 0) { endBallAnimation(); return; }

    // Advance along trajectory at real speed
    ballT += dt * (traj.length / pitchData.travelTime);

    const idx = Math.min(Math.floor(ballT), traj.length - 1);

    if (idx >= traj.length - 1) {
        // Ball reached home plate
        endBallAnimation();
        return;
    }

    const p0 = traj[idx];
    const p1 = traj[Math.min(idx + 1, traj.length - 1)];
    const frac = ballT - idx;

    // Interpolate position
    const bx = p0.x + (p1.x - p0.x) * frac;
    const by = p0.y + (p1.y - p0.y) * frac;
    const bz = p0.z + (p1.z - p0.z) * frac;

    ballMesh.position.set(bx, by, bz);

    // Ball spin rotation
    ballMesh.rotation.x += dt * 30;
    ballMesh.rotation.z += dt * 20;

    // Trail
    const spec = PITCH_SPECS[pitchData.pitchType] || {};
    if (idx % 3 === 0) addTrailPoint({x:bx, y:by, z:bz}, spec.color || '#88BBFF');

    // Update HUD speed dynamically
    const curSpeed = p0.speedKmh;
    document.getElementById('hud-speed').textContent = curSpeed.toFixed(1) + ' km/h';
    document.getElementById('hud-break').textContent =
        `H:${((pitchData.finalX||0)*30).toFixed(1)}cm V:${((pitchData.finalY-0.65)*-30).toFixed(1)}cm`;
}

function endBallAnimation() {
    ballAnimating = false;
    STATE.isThrowing = false;

    // Judge pitch
    if (!pitchData) return;
    const fx = pitchData.finalX || 0;
    const fy = pitchData.finalY || 0.65;

    // Strike zone: x ±0.215m, y 0.51~1.18m
    const isStrike = Math.abs(fx) < 0.215 && fy >= 0.51 && fy < 1.18;

    // Probability of swing (simulate batter logic)
    const nearEdge = Math.abs(fx) > 0.15 || fy < 0.55 || fy > 1.1;
    const swings = Math.random() < (isStrike ? 0.7 : nearEdge ? 0.35 : 0.15);

    let resultText, resultSub, resultColor;

    if (swings && isStrike) {
        // Perfect hit or foul or swing-miss
        const hitRng = Math.random();
        if (hitRng < 0.3) {
            resultText = 'HIT!'; resultSub = '안타!'; resultColor = '#f59e0b';
            setTimeout(() => triggerHitAnimation(), 100);
        } else if (hitRng < 0.5) {
            resultText = 'FOUL'; resultSub = '파울볼'; resultColor = '#94a3b8';
            addStrike();
        } else {
            resultText = 'STRIKE!'; resultSub = '헛스윙 삼진!'; resultColor = '#ef4444';
            addStrike();
        }
    } else if (swings && !isStrike) {
        resultText = 'STRIKE!'; resultSub = '헛스윙!'; resultColor = '#ef4444';
        addStrike();
    } else if (!swings && isStrike) {
        resultText = 'STRIKE!'; resultSub = '루킹 스트라이크!'; resultColor = '#ef4444';
        addStrike();
    } else {
        resultText = 'BALL'; resultSub = '볼!'; resultColor = '#22c55e';
        addBall();
    }

    showResult(resultText, resultSub, resultColor);
    addToLog(pitchData, resultText);
    updateSZCanvas(pitchData.finalX, pitchData.finalY, isStrike);

    // Enable throw button again
    document.getElementById('btn-pitch').disabled = false;

    // Auto-clear ball after 2s
    setTimeout(() => {
        if (ballMesh) { scene.remove(ballMesh); ballMesh = null; }
        clearTrail();
    }, 2000);
}

function triggerHitAnimation() {
    if (!ballMesh) return;
    // Simulate hit ball flying away
    let hVx = (Math.random() - 0.5) * 15;
    let hVy = 15 + Math.random() * 10;
    let hVz = -(20 + Math.random() * 30);
    let hT = 0;
    const hInterval = setInterval(() => {
        hT += 1/60;
        hVy -= 9.8 / 60;
        if (ballMesh) {
            ballMesh.position.x += hVx / 60;
            ballMesh.position.y += hVy / 60;
            ballMesh.position.z += hVz / 60;
        }
        if (hT > 3 || !ballMesh) clearInterval(hInterval);
    }, 1000/60);
}

// ══════════════════════════════════════════════════════════════════
//  GAME LOGIC
// ══════════════════════════════════════════════════════════════════
function addStrike() {
    STATE.strikes++;
    if (STATE.strikes >= 3) {
        STATE.outs++;
        STATE.strikes = 0;
        STATE.balls = 0;
        if (STATE.outs >= 3) { STATE.outs = 0; STATE.inning++; }
    }
    updateCountDisplay();
    updateScoreBoard();
}

function addBall() {
    STATE.balls++;
    if (STATE.balls >= 4) {
        STATE.balls = 0;
        STATE.strikes = 0;
        // Walk
    }
    updateCountDisplay();
}

function updateCountDisplay() {
    for (let i = 0; i < 3; i++) {
        const d = document.getElementById('ball-' + i);
        if (d) d.classList.toggle('active', i < STATE.balls);
    }
    for (let i = 0; i < 2; i++) {
        const d = document.getElementById('strike-' + i);
        if (d) d.classList.toggle('active', i < STATE.strikes);
    }
}

function updateScoreBoard() {
    document.getElementById('sc-inning').textContent = STATE.inning;
    document.getElementById('sc-home').textContent   = STATE.homeScore;
    document.getElementById('sc-away').textContent   = STATE.awayScore;
    document.getElementById('sc-out').textContent    = STATE.outs;
    document.getElementById('sc-pitches').textContent= STATE.totalPitches;
}

function showResult(text, sub, color) {
    const ov = document.getElementById('pitch-result-overlay');
    const rt = document.getElementById('result-text');
    const rs = document.getElementById('result-sub');
    rt.textContent = text;
    rt.style.color = color;
    rs.textContent = sub;
    ov.classList.add('show');
    setTimeout(() => ov.classList.remove('show'), 1800);
}

function addToLog(data, result) {
    const log = document.getElementById('pitch-log');
    const spec = PITCH_SPECS[data.pitchType] || {};
    const div = document.createElement('div');
    div.className = 'log-entry';
    const rColor = result === 'BALL' ? '#22c55e' : result === 'HIT!' ? '#f59e0b' : '#ef4444';
    div.innerHTML = `
        <div class="log-dot" style="background:${spec.color||'#888'}"></div>
        <div class="log-name">${spec.name||'?'}</div>
        <div class="log-speed">${data.speedKmh.toFixed(0)}km</div>
        <div class="log-result" style="color:${rColor}">${result}</div>
    `;
    log.prepend(div);
    if (log.children.length > 30) log.removeChild(log.lastChild);
}

// ── Strike Zone Canvas (mini HUD) ─────────────────────────────────
function updateSZCanvas(fx, fy, isStrike) {
    const cvs = document.getElementById('sz-canvas');
    const ctx = cvs.getContext('2d');
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    // Strike zone rect (canvas coords)
    const szX = 15, szW = 90, szY = 10, szH = 80;

    // Background
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, cvs.width, cvs.height);

    // Strike zone
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(szX, szY, szW, szH);

    // Grid
    ctx.strokeStyle = 'rgba(59,130,246,0.3)';
    ctx.lineWidth = 0.5;
    for (let i = 1; i < 3; i++) {
        ctx.beginPath(); ctx.moveTo(szX + szW/3*i, szY); ctx.lineTo(szX + szW/3*i, szY+szH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(szX, szY+szH/3*i); ctx.lineTo(szX+szW, szY+szH/3*i); ctx.stroke();
    }

    // Ball position
    // fx: -0.215 ~ 0.215 → szX ~ szX+szW
    // fy: 0.51 ~ 1.18   → szY+szH ~ szY
    const bx = szX + szW * (fx / 0.43 + 0.5);
    const by = szY + szH * (1 - (fy - 0.51) / 0.67);
    const bClamp = {
        x: Math.max(szX-10, Math.min(szX+szW+10, bx)),
        y: Math.max(szY-10, Math.min(szY+szH+10, by)),
    };

    ctx.beginPath();
    ctx.arc(bClamp.x, bClamp.y, 6, 0, Math.PI*2);
    ctx.fillStyle = isStrike ? '#ef4444' : '#22c55e';
    ctx.shadowBlur = 8;
    ctx.shadowColor = isStrike ? '#ef4444' : '#22c55e';
    ctx.fill();
    ctx.shadowBlur = 0;
}

// ── Aim Canvas ─────────────────────────────────────────────────────
function initAimCanvas() {
    const cvs = document.getElementById('aim-canvas');
    const ctx = cvs.getContext('2d');
    drawAimCanvas(ctx, cvs.width, cvs.height, 0, 0);

    cvs.addEventListener('click', (e) => {
        const rect = cvs.getBoundingClientRect();
        const mx = (e.clientX - rect.left) / rect.width * 2 - 1;
        const my = -((e.clientY - rect.top) / rect.height * 2 - 1);
        STATE.aimX = Math.max(-1, Math.min(1, mx));
        STATE.aimY = Math.max(-1, Math.min(1, my));
        drawAimCanvas(ctx, cvs.width, cvs.height, STATE.aimX, STATE.aimY);
    });

    cvs.addEventListener('mousemove', (e) => {
        if (e.buttons !== 1) return;
        const rect = cvs.getBoundingClientRect();
        const mx = (e.clientX - rect.left) / rect.width * 2 - 1;
        const my = -((e.clientY - rect.top) / rect.height * 2 - 1);
        STATE.aimX = Math.max(-1, Math.min(1, mx));
        STATE.aimY = Math.max(-1, Math.min(1, my));
        drawAimCanvas(ctx, cvs.width, cvs.height, STATE.aimX, STATE.aimY);
    });
}

function drawAimCanvas(ctx, w, h, ax, ay) {
    ctx.clearRect(0, 0, w, h);

    // Background - batter's perspective
    const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w*0.7);
    grad.addColorStop(0, '#1e2d3e');
    grad.addColorStop(1, '#0a1520');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Strike zone
    const szX = w*0.2, szY = h*0.1, szW = w*0.6, szH = h*0.8;
    ctx.strokeStyle = 'rgba(59,130,246,0.8)';
    ctx.lineWidth = 2;
    ctx.strokeRect(szX, szY, szW, szH);

    // Zone grid
    ctx.strokeStyle = 'rgba(59,130,246,0.2)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 3; i++) {
        ctx.beginPath(); ctx.moveTo(szX + szW/3*i, szY); ctx.lineTo(szX + szW/3*i, szY+szH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(szX, szY + szH/3*i); ctx.lineTo(szX+szW, szY+szH/3*i); ctx.stroke();
    }

    // Home plate hint
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    const px = w/2, py = h*0.95;
    ctx.beginPath();
    ctx.moveTo(px-20, py); ctx.lineTo(px+20, py); ctx.lineTo(px+20, py-5);
    ctx.lineTo(px, py-12); ctx.lineTo(px-20, py-5); ctx.closePath();
    ctx.stroke();

    // Target crosshair
    const tx = w/2 + ax * szW/2;
    const ty = h/2 - ay * szH/2;

    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.moveTo(tx-10, ty); ctx.lineTo(tx+10, ty); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx, ty-10); ctx.lineTo(tx, ty+10); ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.arc(tx, ty, 5, 0, Math.PI*2);
    ctx.fillStyle = '#f59e0b';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#f59e0b';
    ctx.fill();
    ctx.shadowBlur = 0;
}

// ── Timing Gauge ──────────────────────────────────────────────────
let timingInterval = null;
function startTimingGauge() {
    timingValue = 0;
    timingDir = 1;
    timingActive = true;
    const fill = document.getElementById('timing-fill');
    const val = document.getElementById('timing-val');

    timingInterval = setInterval(() => {
        timingValue += timingDir * 3;
        if (timingValue >= 100) { timingValue = 100; timingDir = -1; }
        if (timingValue <= 0)   { timingValue = 0;   timingDir = 1; }
        fill.style.width = timingValue + '%';
        val.textContent = timingValue + '%';
    }, 16);
}

function stopTimingGauge() {
    clearInterval(timingInterval);
    timingActive = false;
    const score = timingValue;
    // Perfect zone: 85~100
    STATE.timingScore = score;
    return score;
}

// ── Power Slider ──────────────────────────────────────────────────
function initPowerSlider() {
    const slider = document.getElementById('power-slider');
    const fill = document.getElementById('power-fill');
    const val = document.getElementById('power-val');
    slider.addEventListener('input', () => {
        STATE.power = +slider.value;
        fill.style.width = STATE.power + '%';
        val.textContent = STATE.power + '%';
    });
}

// ── Pitch Grid ────────────────────────────────────────────────────
function buildPitchGrid() {
    const grid = document.getElementById('pitch-grid');
    grid.innerHTML = '';

    Object.entries(PITCH_SPECS).forEach(([key, spec]) => {
        const btn = document.createElement('button');
        btn.className = 'pitch-btn' + (key === STATE.selectedPitch ? ' active' : '');
        btn.dataset.key = key;
        btn.innerHTML = `
            <div><span class="pitch-dot" style="background:${spec.color}"></span>${spec.name}</div>
            <div class="pitch-spd">${spec.speedKmh[0]}-${spec.speedKmh[1]} km/h</div>
        `;
        btn.addEventListener('click', () => {
            document.querySelectorAll('.pitch-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            STATE.selectedPitch = key;
        });
        grid.appendChild(btn);
    });
}

// ── Main Pitch Action ─────────────────────────────────────────────
function executePitch() {
    if (STATE.isThrowing) return;

    const timing = stopTimingGauge();
    const powerFactor = (STATE.power / 100) * (0.85 + (timing / 100) * 0.15);
    const isPerfect = timing >= 85;

    STATE.totalPitches++;
    updateScoreBoard();
    document.getElementById('btn-pitch').disabled = true;

    // Slight random offset based on timing quality
    const jitter = (100 - timing) / 100 * 0.15;
    const targetX = (STATE.aimX * 0.215) + (Math.random()-0.5) * jitter;
    const targetY = 0.51 + (1 - (STATE.aimY * 0.5 + 0.5)) * 0.67 + (Math.random()-0.5) * jitter;

    requestPhysicsSimulation(STATE.selectedPitch, {
        powerFactor,
        targetX,
        targetY,
        id: pendingPitchId + 1,
    });

    // Restart timing gauge for next pitch (slight delay)
    setTimeout(startTimingGauge, 2500);
}

// ── Reset ─────────────────────────────────────────────────────────
function resetGame() {
    STATE.balls = STATE.strikes = STATE.outs = 0;
    STATE.inning = 1; STATE.homeScore = STATE.awayScore = 0; STATE.totalPitches = 0;
    STATE.isThrowing = false;
    updateCountDisplay();
    updateScoreBoard();
    if (ballMesh) { scene.remove(ballMesh); ballMesh = null; }
    clearTrail();
    document.getElementById('pitch-log').innerHTML = '';
    document.getElementById('pitch-info-hud').style.display = 'none';
    document.getElementById('btn-pitch').disabled = false;
    startTimingGauge();
}

// ══════════════════════════════════════════════════════════════════
//  UI INIT
// ══════════════════════════════════════════════════════════════════
function initUI() {
    buildPitchGrid();
    initAimCanvas();
    initPowerSlider();

    document.getElementById('btn-pitch').addEventListener('click', executePitch);
    document.getElementById('btn-reset-game').addEventListener('click', resetGame);

    // Start timing gauge
    startTimingGauge();

    updateCountDisplay();
    updateScoreBoard();
}

// ══════════════════════════════════════════════════════════════════
//  ANIMATE LOOP
// ══════════════════════════════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
    animReq = requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    // Ball animation
    updateBallAnimation(dt);

    // Dust
    updateDust(dt);

    // Pitcher arm
    if (pitcherArmAnim > 0) {
        const arm = pitcherGroup.getObjectByName('throw-arm');
        if (arm) {
            arm.rotation.z = -1.2 + Math.sin(pitcherArmAnim * Math.PI) * 1.8;
            arm.rotation.x = -0.5 - Math.sin(pitcherArmAnim * Math.PI) * 0.5;
        }
        pitcherArmAnim -= dt * 3;
        if (pitcherArmAnim < 0) pitcherArmAnim = 0;
    }

    // Camera transition
    if (camTarget) {
        camTarget.t += dt * 2.5;
        if (camTarget.t >= 1) {
            camera.position.copy(camTarget.pos);
            camera.fov = camTarget.fov;
            camera.updateProjectionMatrix();
            camera.lookAt(0, 1, 0);
            camTarget = null;
        } else {
            camera.position.lerpVectors(camTarget.fromPos, camTarget.pos, camTarget.t);
            camera.fov = camTarget.fromFov + (camTarget.fov - camTarget.fromFov) * camTarget.t;
            camera.updateProjectionMatrix();
        }
    }

    renderer.render(scene, camera);
}

// ── Boot ──────────────────────────────────────────────────────────
window.addEventListener('load', init);
</script>
