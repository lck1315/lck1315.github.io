<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DODO Baseball | 프로야구</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Noto Sans KR',sans-serif}
canvas{display:block;position:absolute;top:0;left:0}
.ui{position:absolute;inset:0;pointer-events:none;z-index:10}

/* ══════ 상단 스코어보드 ══════ */
#hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;padding:10px}
#scoreboard{
  display:flex;align-items:stretch;
  background:linear-gradient(180deg,rgba(10,15,30,0.95),rgba(15,23,42,0.9));
  border:1px solid rgba(255,255,255,0.08);border-radius:10px;
  box-shadow:0 4px 20px rgba(0,0,0,0.8);overflow:hidden;
  font-family:'Oswald',sans-serif;color:#fff;min-width:500px;
}
.sb-team{display:flex;align-items:center;gap:10px;padding:8px 16px;min-width:130px}
.sb-team.away{background:rgba(30,64,175,0.6)}
.sb-team.home{background:rgba(153,27,27,0.6)}
.team-logo{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;border:2px solid rgba(255,255,255,0.3)}
.team-logo.away-logo{background:#1e40af}
.team-logo.home-logo{background:#991b1b}
.team-name{font-size:0.9rem;font-weight:700;opacity:0.9}
.sb-score{font-size:2.2rem;font-weight:900;min-width:30px;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,0.8)}
.sb-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 20px;border-left:1px solid rgba(255,255,255,0.08);border-right:1px solid rgba(255,255,255,0.08)}
.sb-inning{font-size:0.8rem;color:#f59e0b;font-weight:700;letter-spacing:1px}
.sb-bso{display:flex;gap:12px;margin-top:4px}
.bso-g{display:flex;align-items:center;gap:3px}
.bso-l{font-size:0.7rem;color:#64748b;font-weight:700;width:10px}
.bso-d{width:10px;height:10px;border-radius:50%;background:#1e293b;border:1.5px solid #334155}
.bso-d.b-on{background:#22c55e;border-color:#16a34a;box-shadow:0 0 6px #22c55e}
.bso-d.s-on{background:#ef4444;border-color:#dc2626;box-shadow:0 0 6px #ef4444}
.bso-d.o-on{background:#f59e0b;border-color:#d97706;box-shadow:0 0 6px #f59e0b}

/* ══════ 좌측 투수 정보 ══════ */
#pitcher-info{
  position:absolute;top:80px;left:15px;
  background:linear-gradient(135deg,rgba(10,15,30,0.9),rgba(20,30,50,0.85));
  border:1px solid rgba(255,255,255,0.08);border-radius:10px;
  padding:12px 16px;color:#fff;min-width:160px;
  box-shadow:0 4px 15px rgba(0,0,0,0.6)
}
.pi-label{font-size:0.7rem;color:#64748b;font-weight:700;text-transform:uppercase}
.pi-name{font-size:1rem;font-weight:900;margin:2px 0}
.pi-speed{font-family:'Oswald',sans-serif;font-size:2.8rem;font-weight:900;color:#f59e0b;line-height:1;text-shadow:0 0 15px rgba(245,158,11,0.4)}
.pi-speed span{font-size:1rem;color:#94a3b8;margin-left:2px}
.pi-type{font-size:0.9rem;color:#60a5fa;font-weight:700;margin-top:2px}
.pi-stat{display:flex;gap:12px;margin-top:8px;font-size:0.75rem;color:#94a3b8}

/* ══════ 우측 미니맵 ══════ */
#diamond-map{
  position:absolute;top:85px;right:20px;width:90px;height:90px;
  background:rgba(10,15,30,0.85);border:1px solid rgba(255,255,255,0.08);border-radius:10px;
  box-shadow:0 4px 15px rgba(0,0,0,0.6)
}
#diamond-canvas{width:90px;height:90px}

/* ══════ 중앙 결과 메시지 ══════ */
#result-popup{
  position:absolute;top:35%;left:50%;transform:translate(-50%,-50%) scale(0.5);
  text-align:center;opacity:0;pointer-events:none;z-index:200;
  transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1)
}
#result-popup.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.rp-main{font-family:'Oswald',sans-serif;font-size:5rem;font-weight:900;color:#fff;line-height:1;-webkit-text-stroke:2px rgba(0,0,0,0.5);text-shadow:0 8px 30px rgba(0,0,0,0.8)}
.rp-sub{font-size:1.8rem;font-weight:700;margin-top:8px;text-shadow:0 4px 15px rgba(0,0,0,0.8)}
.rp-speed{font-family:'Oswald',sans-serif;font-size:2rem;color:#f59e0b;font-weight:900;margin-top:5px}

/* ══════ 이닝 교대 화면 ══════ */
#inning-screen{
  position:absolute;inset:0;background:rgba(0,0,0,0.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;opacity:0;pointer-events:none;z-index:300;
  transition:opacity 0.4s
}
#inning-screen.show{opacity:1;pointer-events:auto}
.is-inning{font-family:'Oswald',sans-serif;font-size:6rem;font-weight:900;color:#f59e0b;text-shadow:0 0 30px rgba(245,158,11,0.5)}
.is-mode{font-size:2rem;font-weight:700;margin-top:10px}
.is-vs{font-size:1rem;color:#94a3b8;margin-top:20px}

/* ══════ 게임 종료 화면 ══════ */
#game-over{
  position:absolute;inset:0;
  background:radial-gradient(circle,rgba(15,23,42,0.95),rgba(0,0,0,0.98));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;opacity:0;pointer-events:none;z-index:400;transition:opacity 0.5s
}
#game-over.show{opacity:1;pointer-events:auto}
.go-title{font-family:'Oswald',sans-serif;font-size:5rem;font-weight:900;text-shadow:0 0 30px rgba(245,158,11,0.5)}
.go-result{font-size:3rem;font-weight:900;margin-top:15px}
.go-score{font-family:'Oswald',sans-serif;font-size:4rem;font-weight:900;margin-top:10px}
.go-btn{
  margin-top:40px;padding:15px 50px;font-size:1.2rem;font-weight:900;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;
  border:none;border-radius:30px;cursor:pointer;pointer-events:auto;
  box-shadow:0 5px 20px rgba(37,99,235,0.5);transition:transform 0.2s
}
.go-btn:hover{transform:scale(1.05)}

/* ══════ 하단 구종 선택 (수비) ══════ */
#pitch-select{
  position:absolute;bottom:25px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;pointer-events:auto;z-index:50
}
.ps-btn{
  background:linear-gradient(180deg,rgba(30,41,59,0.9),rgba(15,23,42,0.95));
  border:2px solid rgba(255,255,255,0.12);border-radius:14px;
  color:#fff;padding:12px 16px;cursor:pointer;min-width:100px;
  box-shadow:0 4px 15px rgba(0,0,0,0.6);transition:all 0.2s;text-align:center
}
.ps-btn:hover{border-color:rgba(96,165,250,0.5);transform:translateY(-3px)}
.ps-btn.active{background:linear-gradient(135deg,#1d4ed8,#2563eb);border-color:#60a5fa;box-shadow:0 0 20px rgba(59,130,246,0.5)}
.ps-name{font-family:'Oswald',sans-serif;font-size:1.1rem;font-weight:700}
.ps-speed{font-size:0.75rem;color:#94a3b8;margin-top:2px}

/* ══════ 하단 안내 텍스트 ══════ */
#guide{
  position:absolute;bottom:90px;left:50%;transform:translateX(-50%);
  font-size:1.1rem;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.8);
  background:rgba(0,0,0,0.5);padding:6px 20px;border-radius:20px;
  white-space:nowrap
}

/* ══════ 구속 & 구종 표시 (투구 후) ══════ */
#speed-display{
  position:absolute;top:50%;right:80px;transform:translateY(-50%);
  text-align:right;opacity:0;transition:opacity 0.3s;pointer-events:none
}
#speed-display.show{opacity:1}
.sd-speed{font-family:'Oswald',sans-serif;font-size:5rem;font-weight:900;color:#f59e0b;line-height:1;text-shadow:0 0 20px rgba(245,158,11,0.5)}
.sd-unit{font-size:1.5rem;color:#94a3b8}
.sd-type{font-size:1.2rem;color:#60a5fa;font-weight:700}
</style>
</head>
<body>

<!-- 메인 게임 캔버스 -->
<canvas id="game-canvas"></canvas>

<!-- UI 오버레이 -->
<div class="ui">
  <!-- 상단 HUD -->
  <div id="hud-top">
    <div id="scoreboard">
      <div class="sb-team away">
        <div class="team-logo away-logo">A</div>
        <div>
          <div class="team-name">STARS</div>
          <div class="sb-score" id="s-away">0</div>
        </div>
      </div>
      <div class="sb-mid">
        <div class="sb-inning" id="sb-inn">1회초</div>
        <div class="sb-bso">
          <div class="bso-g"><span class="bso-l">B</span><div class="bso-d" id="bd1"></div><div class="bso-d" id="bd2"></div><div class="bso-d" id="bd3"></div></div>
          <div class="bso-g"><span class="bso-l">S</span><div class="bso-d" id="sd1"></div><div class="bso-d" id="sd2"></div></div>
          <div class="bso-g"><span class="bso-l">O</span><div class="bso-d" id="od1"></div><div class="bso-d" id="od2"></div></div>
        </div>
      </div>
      <div class="sb-team home">
        <div>
          <div class="team-name">DODO</div>
          <div class="sb-score" id="s-home">0</div>
        </div>
        <div class="team-logo home-logo">D</div>
      </div>
    </div>
  </div>

  <!-- 투수 정보 -->
  <div id="pitcher-info">
    <div class="pi-label">PITCHER</div>
    <div class="pi-name" id="pi-name">DODO 에이스</div>
    <div class="pi-speed"><span id="pi-spd">0</span><span>km/h</span></div>
    <div class="pi-type" id="pi-type">-</div>
    <div class="pi-stat">
      <span>투구수: <b id="pi-cnt">0</b></span>
      <span>삼진: <b id="pi-k">0</b></span>
    </div>
  </div>

  <!-- 다이아몬드 미니맵 -->
  <div id="diamond-map"><canvas id="diamond-canvas" width="90" height="90"></canvas></div>

  <!-- 구종 선택 -->
  <div id="pitch-select" style="display:none">
    <button class="ps-btn" data-p="4seam"><div class="ps-name">4SEAM</div><div class="ps-speed">145-155 km/h</div></button>
    <button class="ps-btn" data-p="slider"><div class="ps-name">SLIDER</div><div class="ps-speed">132-140 km/h</div></button>
    <button class="ps-btn" data-p="curve"><div class="ps-name">CURVE</div><div class="ps-speed">118-128 km/h</div></button>
    <button class="ps-btn" data-p="change"><div class="ps-name">CHANGE</div><div class="ps-speed">128-136 km/h</div></button>
    <button class="ps-btn" data-p="cutter"><div class="ps-name">CUTTER</div><div class="ps-speed">138-145 km/h</div></button>
  </div>

  <!-- 안내 -->
  <div id="guide"></div>

  <!-- 구속 표시 -->
  <div id="speed-display">
    <div class="sd-speed"><span id="sd-v">0</span><span class="sd-unit">km/h</span></div>
    <div class="sd-type" id="sd-t"></div>
  </div>

  <!-- 결과 팝업 -->
  <div id="result-popup"><div class="rp-main" id="rp-m"></div><div class="rp-sub" id="rp-s"></div><div class="rp-speed" id="rp-spd"></div></div>

  <!-- 이닝 교대 -->
  <div id="inning-screen">
    <div class="is-inning" id="is-inn"></div>
    <div class="is-mode" id="is-mode"></div>
    <div class="is-vs" id="is-vs"></div>
  </div>

  <!-- 게임 종료 -->
  <div id="game-over">
    <div class="go-title">GAME OVER</div>
    <div class="go-result" id="go-r"></div>
    <div class="go-score" id="go-s"></div>
    <button class="go-btn" onclick="location.reload()">다시 하기</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  DODO BASEBALL - PREMIUM EDITION
//  Canvas 2D 기반 풀 9이닝 야구 게임
// ═══════════════════════════════════════════════════

const C = document.getElementById('game-canvas');
const X = C.getContext('2d');
const DC = document.getElementById('diamond-canvas');
const DX = DC.getContext('2d');

let W, H, CX, CY;
function resize() {
    W = C.width = window.innerWidth;
    H = C.height = window.innerHeight;
    CX = W / 2; CY = H / 2;
}
resize();
window.addEventListener('resize', resize);

// ─── 상수 ───
const PITCH_DATA = {
    '4seam':  { name: '포심 패스트볼', min: 145, max: 155, breakX: 0,   breakY: -5,  color: '#ef4444' },
    'slider': { name: '슬라이더',     min: 132, max: 140, breakX: -35,  breakY: 10,  color: '#06b6d4' },
    'curve':  { name: '커브',         min: 118, max: 128, breakX: -10,  breakY: 50,  color: '#8b5cf6' },
    'change': { name: '체인지업',     min: 128, max: 136, breakX: 15,   breakY: 25,  color: '#22c55e' },
    'cutter': { name: '커터',         min: 138, max: 145, breakX: -15,  breakY: 0,   color: '#f59e0b' }
};

const BATTER_NAMES = ['김도도','박민수','이준호','최강훈','정우성','한동석','오세진','양기훈','송태양'];
const PITCHER_NAMES = ['DODO 에이스','도도 불펜1','도도 마무리'];

// ─── 게임 상태 ───
const G = {
    phase: 'INIT', // INIT, INNING_INTRO, PITCH_SELECT, PITCH_AIM, PITCH_TIMING, BALL_FLY, RESULT, BAT_WAIT, BAT_READY, BAT_SWING, GAME_OVER
    inning: 1, half: 'top', // top = 원정팀 공격 = 유저 수비
    awayScore: 0, homeScore: 0,
    strikes: 0, balls: 0, outs: 0,
    bases: [0,0,0], // 0 or 1
    totalK: 0, pitchCount: 0,
    currentBatterIdx: 0,
    
    // 투구 관련
    selectedPitch: null,
    aimPos: {x:0, y:0}, // -1~1 normalized
    timingScore: 0, // 0~1
    lastSpeed: 0,
    
    // 공 비행
    ball: {active:false, t:0, startTime:0, duration:0, sx:0, sy:0, ex:0, ey:0, pitch:null, trail:[]},
    
    // 타자 커서
    batCursor: {x: 0, y: 0, visible: false},
    
    // 애니메이션
    pitcherAnim: 'idle', // idle, windup, throw, follow
    pitcherFrame: 0,
    batterAnim: 'ready', // ready, swing, hit
    batterFrame: 0,
    
    // 파티클
    particles: [],
    screenShake: 0,
    flashAlpha: 0,
};

// 스트라이크 존 좌표 (캔버스 기준)
function getZone() {
    const w = W * 0.11; // 스트라이크 존 너비
    const h = w * 1.3;  // 높이
    const x = CX - w/2;
    const y = H * 0.48 - h/2;
    return {x, y, w, h, cx: x+w/2, cy: y+h/2};
}

// ═══ 렌더링 시스템 ═══

function renderField() {
    const shk = G.screenShake;
    if (shk > 0) {
        X.save();
        X.translate((Math.random()-0.5)*shk*2, (Math.random()-0.5)*shk*2);
        G.screenShake *= 0.9;
        if (G.screenShake < 0.5) G.screenShake = 0;
    }
    
    // ── 야간 하늘 ──
    const sky = X.createLinearGradient(0, 0, 0, H * 0.45);
    sky.addColorStop(0, '#050a18');
    sky.addColorStop(0.5, '#0c1629');
    sky.addColorStop(1, '#162240');
    X.fillStyle = sky;
    X.fillRect(0, 0, W, H);
    
    // 별
    X.fillStyle = '#fff';
    for (let i = 0; i < 60; i++) {
        const sx = ((i * 137.5 + 50) % W);
        const sy = ((i * 97.3 + 30) % (H * 0.3));
        const sr = 0.3 + Math.sin(performance.now()/1000 + i) * 0.3;
        X.globalAlpha = 0.3 + Math.sin(performance.now()/2000 + i*2) * 0.3;
        X.beginPath(); X.arc(sx, sy, sr, 0, Math.PI*2); X.fill();
    }
    X.globalAlpha = 1;
    
    // ── 조명등 기둥 (좌/우) ──
    const lightPositions = [
        {x: W*0.08, baseY: H*0.45},
        {x: W*0.2, baseY: H*0.4},
        {x: W*0.8, baseY: H*0.4},
        {x: W*0.92, baseY: H*0.45}
    ];
    lightPositions.forEach(lp => {
        // 기둥
        X.strokeStyle = '#334155'; X.lineWidth = 4;
        X.beginPath(); X.moveTo(lp.x, lp.baseY); X.lineTo(lp.x, lp.baseY - H*0.25); X.stroke();
        // 조명 (glow)
        const lg = X.createRadialGradient(lp.x, lp.baseY - H*0.25, 0, lp.x, lp.baseY - H*0.25, 80);
        lg.addColorStop(0, 'rgba(255,255,200,0.8)');
        lg.addColorStop(0.3, 'rgba(255,255,200,0.3)');
        lg.addColorStop(1, 'transparent');
        X.fillStyle = lg;
        X.fillRect(lp.x - 80, lp.baseY - H*0.25 - 80, 160, 160);
        // 조명 빔
        X.fillStyle = 'rgba(255,255,200,0.03)';
        X.beginPath();
        X.moveTo(lp.x - 10, lp.baseY - H*0.25);
        X.lineTo(CX - 200, H);
        X.lineTo(CX + 200, H);
        X.lineTo(lp.x + 10, lp.baseY - H*0.25);
        X.fill();
    });
    
    // ── 관중석 ──
    const crowdY = H * 0.32;
    const crowdH = H * 0.15;
    // 관중석 배경
    const crowdGrad = X.createLinearGradient(0, crowdY, 0, crowdY + crowdH);
    crowdGrad.addColorStop(0, '#1e293b');
    crowdGrad.addColorStop(1, '#0f172a');
    X.fillStyle = crowdGrad;
    X.fillRect(0, crowdY, W, crowdH);
    
    // 관중 점들 (화려한 관중석)
    const t = performance.now() / 1000;
    for (let i = 0; i < 200; i++) {
        const cx2 = (i * 10.7 + 5) % W;
        const cy2 = crowdY + 5 + (i * 7.3) % (crowdH - 10);
        const hue = (i * 37) % 360;
        const bounce = Math.sin(t * 2 + i * 0.5) * 2;
        X.fillStyle = `hsla(${hue},70%,60%,${0.4 + Math.sin(t + i)*0.2})`;
        X.beginPath(); X.arc(cx2, cy2 + bounce, 2.5, 0, Math.PI*2); X.fill();
    }
    
    // 관중석 테두리 (펜스)
    X.strokeStyle = '#475569'; X.lineWidth = 3;
    X.beginPath(); X.moveTo(0, crowdY + crowdH); X.lineTo(W, crowdY + crowdH); X.stroke();
    
    // ── 외야 잔디 ──
    const fieldY = crowdY + crowdH;
    const grassGrad = X.createLinearGradient(0, fieldY, 0, H);
    grassGrad.addColorStop(0, '#15803d');
    grassGrad.addColorStop(0.3, '#166534');
    grassGrad.addColorStop(0.7, '#14532d');
    grassGrad.addColorStop(1, '#0f4a25');
    X.fillStyle = grassGrad;
    X.fillRect(0, fieldY, W, H - fieldY);
    
    // 잔디 패턴 (줄무늬)
    for (let i = 0; i < 12; i++) {
        const y = fieldY + i * ((H - fieldY) / 12);
        X.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.03)';
        X.fillRect(0, y, W, (H - fieldY) / 12);
    }
    
    // ── 내야 흙 (원근감 있는 다이아몬드) ──
    X.fillStyle = '#7c4a1a';
    X.beginPath();
    // 투수 마운드
    X.ellipse(CX, H * 0.52, W * 0.06, H * 0.025, 0, 0, Math.PI * 2);
    X.fill();
    // 마운드 하이라이트
    X.fillStyle = '#8b5e34';
    X.beginPath();
    X.ellipse(CX, H * 0.515, W * 0.04, H * 0.015, 0, 0, Math.PI * 2);
    X.fill();
    
    // 투수판 (러버)
    X.fillStyle = '#fff';
    X.fillRect(CX - 15, H * 0.52 - 3, 30, 6);
    
    // ── 홈플레이트 구역 흙 ──
    X.fillStyle = '#7c4a1a';

    X.ellipse(CX, H * 0.92, W * 0.15, H * 0.08, 0, 0, Math.PI * 2);
    X.fill();
    
    // 타석 라인
    X.strokeStyle = 'rgba(255,255,255,0.4)';
    X.lineWidth = 2;

    // 좌타석
    X.strokeRect(CX - bw - 30, H*0.85, bw, bh);
    // 우타석
    X.strokeRect(CX + 30, H*0.85, bw, bh);
    
    // 홈플레이트
    X.fillStyle = '#fff';
    X.beginPath();
    const hx = CX, hy = H * 0.9;
    X.moveTo(hx - 12, hy - 12);
    X.lineTo(hx + 12, hy - 12);
    X.lineTo(hx + 12, hy + 2);
    X.lineTo(hx, hy + 14);
    X.lineTo(hx - 12, hy + 2);
    X.fill();

function renderPitcher() {

        X.fillRect(3, 5 - f * 2, 7, 20);
    } else if (anim === 'throw') {
        X.fillRect(-12, 12, 7, 22);
        X.fillRect(5, 14, 7, 22);
    } else {
        X.fillRect(-7, 15, 6, 22);
        X.fillRect(3, 15, 6, 22);
    }
    
    // 몸통 (유니폼)
    X.fillStyle = uniColor;
    X.beginPath();
    X.ellipse(0, 5, 14, 20, 0, 0, Math.PI * 2);

    // 유니폼 하이라이트

    // 팔

    X.fillStyle = '#fde68a';

    // 모자

    X.fillRect(-14, -27, 28, 4);
    
    // 등번호
    X.fillStyle = '#fff'; X.font = 'bold 8px Oswald'; X.textAlign = 'center';

}

function renderStrikeZone() {
    if (G.phase === 'PITCH_AIM' || G.phase === 'BAT_WAIT' || G.phase === 'BAT_READY' || G.phase === 'BALL_FLY') {
        const z = getZone();
        // 외곽선
        X.strokeStyle = 'rgba(255,255,255,0.5)'; X.lineWidth = 2;
        X.strokeRect(z.x, z.y, z.w, z.h);
        // 3x3 그리드
        X.strokeStyle = 'rgba(255,255,255,0.15)'; X.lineWidth = 1;
        for (let i = 1; i < 3; i++) {
            X.beginPath(); X.moveTo(z.x + z.w/3*i, z.y); X.lineTo(z.x + z.w/3*i, z.y + z.h); X.stroke();
            X.beginPath(); X.moveTo(z.x, z.y + z.h/3*i); X.lineTo(z.x + z.w, z.y + z.h/3*i); X.stroke();
        }
    }
    
    // 에임 커서 (수비 시 조준)
    if (G.phase === 'PITCH_AIM') {
        const z = getZone();
        const ax = z.cx + G.aimPos.x * z.w/2;
        const ay = z.cy + G.aimPos.y * z.h/2;
        X.strokeStyle = '#ef4444'; X.lineWidth = 3;
        X.beginPath(); X.arc(ax, ay, 18, 0, Math.PI*2); X.stroke();
        X.strokeStyle = '#ef4444'; X.lineWidth = 2;
        X.beginPath(); X.moveTo(ax-25,ay); X.lineTo(ax+25,ay); X.stroke();
        X.beginPath(); X.moveTo(ax,ay-25); X.lineTo(ax,ay+25); X.stroke();
    }
}

function renderBall() {
    if (!G.ball.active) return;
    const now = performance.now();
    let t = (now - G.ball.startTime) / G.ball.duration;
    if (t > 1) t = 1;
    
    const p = G.ball.pitch;
    const ease = t * t;
    const bx = G.ball.sx + (G.ball.ex - G.ball.sx) * t + Math.sin(t * Math.PI) * p.breakX * (W/1920);
    const by = G.ball.sy + (G.ball.ey - G.ball.sy) * t + Math.sin(t * Math.PI * 0.8) * p.breakY * (H/1080);
    const scale = 0.3 + ease * 1.8;
    const r = 8 * scale;
    
    // 잔상 추가
    G.ball.trail.push({x: bx, y: by, r: r, a: 1, t: now});
    
    // 잔상 렌더
    G.ball.trail = G.ball.trail.filter(tr => now - tr.t < 150);
    G.ball.trail.forEach(tr => {
        const age = (now - tr.t) / 150;
        X.globalAlpha = (1 - age) * 0.5;
        X.fillStyle = p.color || '#fff';
        X.beginPath(); X.arc(tr.x, tr.y, tr.r * (1 - age*0.5), 0, Math.PI*2); X.fill();
    });
    X.globalAlpha = 1;
    
    // 공 본체
    const ballGrad = X.createRadialGradient(bx - r*0.3, by - r*0.3, 0, bx, by, r);
    ballGrad.addColorStop(0, '#ffffff');
    ballGrad.addColorStop(0.7, '#e2e8f0');
    ballGrad.addColorStop(1, '#94a3b8');
    X.fillStyle = ballGrad;
    X.beginPath(); X.arc(bx, by, r, 0, Math.PI*2); X.fill();
    
    // 솔기 (seam)
    if (r > 4) {
        X.strokeStyle = '#ef4444'; X.lineWidth = Math.max(1, r * 0.15);
        const rot = t * 20;
        X.beginPath();
        X.arc(bx, by, r * 0.6, rot, rot + Math.PI * 0.8);
        X.stroke();
        X.beginPath();
        X.arc(bx, by, r * 0.6, rot + Math.PI, rot + Math.PI * 1.8);
        X.stroke();
    }
    
    // 그림자
    X.fillStyle = 'rgba(0,0,0,0.3)';
    X.beginPath(); X.ellipse(bx, by + r + 5*scale, r*0.8, r*0.25, 0, 0, Math.PI*2); X.fill();
    
    if (t >= 1) {
        G.ball.active = false;
        onBallArrived(bx, by);
    }
}

function renderBatCursor() {

    // 외부 원

    // 십자선

    X.beginPath(); X.moveTo(bx-30,by); X.lineTo(bx+30,by); X.stroke();
    X.beginPath(); X.moveTo(bx,by-30); X.lineTo(bx,by+30); X.stroke();

function renderTimingGauge() {
    if (G.phase !== 'PITCH_TIMING') return;
    
    // 중앙에 동심원 게이지
    const gx = CX, gy = CY;
    
    // GOOD 원 (중간)
    X.strokeStyle = 'rgba(245,158,11,0.6)'; X.lineWidth = 2; X.setLineDash([5,5]);
    X.beginPath(); X.arc(gx, gy, 60, 0, Math.PI*2); X.stroke();
    X.setLineDash([]);
    
    // PERFECT 원 (작은)
    X.strokeStyle = '#22c55e'; X.lineWidth = 4;
    X.beginPath(); X.arc(gx, gy, 35, 0, Math.PI*2); X.stroke();
    X.fillStyle = 'rgba(34,197,94,0.15)';
    X.beginPath(); X.arc(gx, gy, 35, 0, Math.PI*2); X.fill();
    
    // 줄어드는 원
    X.strokeStyle = '#fff'; X.lineWidth = 5;
    X.shadowColor = '#fff'; X.shadowBlur = 15;
    X.beginPath(); X.arc(gx, gy, G.timingGaugeSize, 0, Math.PI*2); X.stroke();
    X.shadowBlur = 0;
    
    // 안내 텍스트
    X.fillStyle = '#fff'; X.font = 'bold 16px "Noto Sans KR"'; X.textAlign = 'center';
    X.fillText('초록 원에 맞춰 클릭!', gx, gy - G.timingGaugeSize - 20);
}

function renderParticles() {
    G.particles = G.particles.filter(p => p.life > 0);
    G.particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15; // 중력
        p.life -= 0.02;
        X.globalAlpha = p.life;
        X.fillStyle = p.color;
        X.beginPath(); X.arc(p.x, p.y, p.size, 0, Math.PI*2); X.fill();
    });
    X.globalAlpha = 1;
}

function renderFlash() {
    if (G.flashAlpha > 0) {
        X.fillStyle = `rgba(255,255,255,${G.flashAlpha})`;
        X.fillRect(0, 0, W, H);
        G.flashAlpha -= 0.05;
    }
}

function renderDiamond() {
    DX.clearRect(0, 0, 90, 90);
    DX.fillStyle = '#0f4a25';
    DX.fillRect(0, 0, 90, 90);
    
    // 다이아몬드 라인
    const d = 45, ox = 45, oy = 45, s = 25;
    DX.strokeStyle = 'rgba(255,255,255,0.4)'; DX.lineWidth = 1.5;
    DX.beginPath();
    DX.moveTo(ox, oy - s); // 2B
    DX.lineTo(ox + s, oy); // 1B
    DX.lineTo(ox, oy + s); // Home
    DX.lineTo(ox - s, oy); // 3B
    DX.closePath();
    DX.stroke();
    
    // 베이스
    const basePos = [{x:ox+s,y:oy}, {x:ox,y:oy-s}, {x:ox-s,y:oy}]; // 1B,2B,3B
    G.bases.forEach((on, i) => {
        DX.fillStyle = on ? '#f59e0b' : '#334155';
        if (on) { DX.shadowColor = '#f59e0b'; DX.shadowBlur = 8; }
        DX.fillRect(basePos[i].x - 5, basePos[i].y - 5, 10, 10);
        DX.shadowBlur = 0;
    });
    // 홈
    DX.fillStyle = '#fff';
    DX.beginPath(); DX.arc(ox, oy + s, 4, 0, Math.PI*2); DX.fill();
}

// ═══ 메인 루프 ═══
function gameLoop() {
    X.clearRect(0, 0, W, H);
    renderField();
    renderStrikeZone();
    renderPitcher();
    renderBatter();
    renderCatcher();
    renderBall();
    renderBatCursor();
    renderTimingGauge();
    renderParticles();
    renderFlash();
    renderDiamond();
    
    // 투수 애니메이션 프레임 업데이트
    if (G.pitcherAnim === 'windup') {
        G.pitcherFrame += 0.3;
        if (G.pitcherFrame > 8) { G.pitcherAnim = 'throw'; G.pitcherFrame = 0; }
    } else if (G.pitcherAnim === 'throw') {
        G.pitcherFrame += 0.5;
        if (G.pitcherFrame > 6) { G.pitcherAnim = 'follow'; G.pitcherFrame = 0; }
    } else if (G.pitcherAnim === 'follow') {
        G.pitcherFrame += 0.1;
        if (G.pitcherFrame > 3) { G.pitcherAnim = 'idle'; G.pitcherFrame = 0; }
    }
    
    // 타자 스윙 애니메이션
    if (G.batterAnim === 'swing') {
        G.batterFrame += 0.8;
        if (G.batterFrame > 8) { G.batterAnim = 'ready'; G.batterFrame = 0; }
    }
    
    requestAnimationFrame(gameLoop);
}

function advanceRunners(bases) {
    let runs = 0;
    if (bases === 4) { // 홈런
        runs = 1;
        for(let i=2;i>=0;i--) { if(G.bases[i]) { runs++; G.bases[i]=0; } }
    } else {
        for(let i=2;i>=0;i--) {
            if(G.bases[i]) {
                G.bases[i] = 0;
                if(i+bases >= 3) runs++;
                else G.bases[i+bases] = 1;
            }
        }
        if (bases <= 3) G.bases[bases-1] = 1;
    }
    if(G.half==='top') G.awayScore += runs;
    else G.homeScore += runs;
    return runs;
}

function processResult(type) {
    let msg='', sub='', color='#fff', spd = G.lastSpeed;
    
    switch(type) {
        case 'STRIKE':
            G.strikes++; msg='STRIKE'; color='#ef4444';
            sub = G.strikes >= 3 ? '' : `S${G.strikes}-B${G.balls}`;
            break;
        case 'BALL':
            G.balls++; msg='BALL'; color='#3b82f6';
            sub = `B${G.balls}-S${G.strikes}`;
            break;
        case 'FOUL':
            if(G.strikes<2) G.strikes++;
            msg='FOUL'; color='#94a3b8'; sub = `S${G.strikes}-B${G.balls}`;
            break;
        case 'HIT':
            msg='안타!'; color='#22c55e';
            const r1 = advanceRunners(1);
            sub = r1 > 0 ? `+${r1} 득점!` : '출루!';
            spawnParticles(CX, CY, 20, '#22c55e');
            G.screenShake = 5;
            break;
        case 'DOUBLE':
            msg='2루타!'; color='#3b82f6';
            const r2 = advanceRunners(2);
            sub = r2 > 0 ? `+${r2} 득점!` : '장타!';
            spawnParticles(CX, CY, 30, '#3b82f6');
            G.screenShake = 8;
            break;
        case 'TRIPLE':
            msg='3루타!!'; color='#8b5cf6';
            const r3 = advanceRunners(3);
            sub = r3 > 0 ? `+${r3} 득점!` : '3루까지!';
            spawnParticles(CX, CY, 40, '#8b5cf6');
            G.screenShake = 10;
            break;
        case 'HR':
            msg='홈런!!!'; color='#f59e0b';
            const rh = advanceRunners(4);
            sub = `+${rh} 득점!!`;
            spawnParticles(CX, CY, 60, '#f59e0b');
            G.screenShake = 15;
            G.flashAlpha = 0.6;
            break;
        case 'OUT':
            G.outs++; msg='아웃!'; color='#94a3b8'; break;
        case 'FLY_OUT':
            G.outs++; msg='플라이 아웃!'; color='#94a3b8'; break;
        case 'GROUND_OUT':
            G.outs++; msg='땅볼 아웃!'; color='#94a3b8'; break;
    }
    
    // 삼진
    if (G.strikes >= 3) {
        G.outs++; G.strikes=0; G.balls=0; G.totalK++;
        msg='삼진!'; sub='STRIKE OUT'; color='#ef4444';
        spawnParticles(CX, H*0.6, 15, '#ef4444');
    }
    // 볼넷
    if (G.balls >= 4) {
        G.strikes=0; G.balls=0;
        msg='볼넷'; sub='WALK'; color='#3b82f6';
        advanceRunners(1);
    }
    // 안타/아웃 계열 카운트 리셋
    if (['HIT','DOUBLE','TRIPLE','HR','OUT','FLY_OUT','GROUND_OUT'].includes(type)) {
        G.strikes=0; G.balls=0; G.currentBatterIdx++;
    }
    
    updateHUD();
    
    showResult(msg, sub, spd, color, 2200, () => {
        if (G.outs >= 3) {
            switchHalf();
        } else {
            startTurn();
        }
    });
}

function switchHalf() {
    G.outs=0; G.strikes=0; G.balls=0; G.bases=[0,0,0];
    
    if (G.half === 'top') {
        G.half = 'bottom';
    } else {
        G.inning++;
        G.half = 'top';
        if (G.inning > 9) {
            endGame();
            return;
        }
    }
    updateHUD();
    showInningScreen(() => startTurn());
}

function endGame() {
    G.phase = 'GAME_OVER';
    const el = document.getElementById('game-over');
    let r = 'DRAW';
    if(G.homeScore > G.awayScore) { r = 'DODO WIN! 🏆'; document.getElementById('go-r').style.color = '#f59e0b'; }
    else if(G.homeScore < G.awayScore) { r = 'DODO LOSE...'; document.getElementById('go-r').style.color = '#94a3b8'; }
    document.getElementById('go-r').textContent = r;
    document.getElementById('go-s').textContent = `${G.awayScore} : ${G.homeScore}`;
    el.classList.add('show');
}

// ═══ 턴 시작 ═══
function startTurn() {
    document.getElementById('pitch-select').style.display = 'none';
    document.getElementById('guide').textContent = '';
    G.batCursor.visible = false;
    G.pitcherAnim = 'idle'; G.pitcherFrame = 0;
    G.batterAnim = 'ready'; G.batterFrame = 0;
    
    const guide = document.getElementById('guide');
    const isDefense = G.half === 'top';
    
    if (isDefense) {
        // ── 유저 수비(투수) ──
        G.phase = 'PITCH_SELECT';
        guide.textContent = '⚾ 구종을 선택하세요';
        document.getElementById('pitch-select').style.display = 'flex';
    } else {
        // ── 유저 공격(타자) ──
        G.phase = 'BAT_WAIT';
        guide.textContent = '🏏 공이 날아오면 타이밍 맞춰 클릭!';
        G.batCursor.visible = true;
        
        // AI가 1.5~2.5초 후 투구
        setTimeout(() => {
            if (G.phase !== 'BAT_WAIT') return;
            G.phase = 'BAT_READY';
            aiPitch();
        }, 1500 + Math.random()*1000);
    }
}

// ── 수비: 구종 선택 ──
document.querySelectorAll('.ps-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        if (G.phase !== 'PITCH_SELECT') return;
        document.querySelectorAll('.ps-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const key = btn.dataset.p;
        G.selectedPitch = PITCH_DATA[key];
        G.phase = 'PITCH_AIM';
        document.getElementById('pitch-select').style.display = 'none';
        document.getElementById('guide').textContent = '🎯 스트라이크 존을 클릭하여 코스 지정';
        
        document.getElementById('pi-type').textContent = G.selectedPitch.name;
    });
});

// ── 수비: 코스 조준 (캔버스 클릭) ──
C.addEventListener('pointerdown', (e) => {
    if (G.phase === 'PITCH_AIM') {
        const z = getZone();
        G.aimPos.x = ((e.clientX - z.cx) / (z.w/2));
        G.aimPos.y = ((e.clientY - z.cy) / (z.h/2));
        // 범위 제한
        G.aimPos.x = Math.max(-1.5, Math.min(1.5, G.aimPos.x));
        G.aimPos.y = Math.max(-1.5, Math.min(1.5, G.aimPos.y));
        
        G.phase = 'PITCH_TIMING';
        G.timingGaugeSize = 120;
        document.getElementById('guide').textContent = '⏱️ 초록 원에 맞춰 클릭!';
        
    } else if (G.phase === 'PITCH_TIMING') {
        // 타이밍 판정
        const diff = Math.abs(G.timingGaugeSize - 35); // 35 = perfect radius
        if (diff < 10) G.timingScore = 1.0;
        else if (diff < 30) G.timingScore = 0.6;
        else G.timingScore = 0.2;
        
        document.getElementById('guide').textContent = '';
        G.pitchCount++;
        G.pitcherAnim = 'windup'; G.pitcherFrame = 0;
        
        setTimeout(() => firePitch(false), 600);
        
    } else if (G.phase === 'BAT_READY' || G.phase === 'BALL_FLY') {
        // 타자 스윙
        if (!G.ball.active) return;
        G.batterAnim = 'swing'; G.batterFrame = 0;
        
        const now = performance.now();
        let t = (now - G.ball.startTime) / G.ball.duration;
        const p = G.ball.pitch;
        const bx = G.ball.sx + (G.ball.ex - G.ball.sx)*t + Math.sin(t*Math.PI)*p.breakX*(W/1920);
        const by = G.ball.sy + (G.ball.ey - G.ball.sy)*t + Math.sin(t*Math.PI*0.8)*p.breakY*(H/1080);
        
        const dist = Math.hypot(G.batCursor.x - bx, G.batCursor.y - by);
        
        G.ball.active = false;
        G.phase = 'RESULT';
        G.batCursor.visible = false;
        
        const z = getZone();
        const inZone = bx > z.x && bx < z.x+z.w && by > z.y && by < z.y+z.h;
        
        if (t > 0.65 && t < 1.05) {
            if (dist < 35) {
                // 완벽 타이밍 + 정확한 위치
                const hr = Math.random();
                if (hr < 0.25) processResult('HR');
                else if (hr < 0.45) processResult('DOUBLE');
                else if (hr < 0.55) processResult('TRIPLE');
                else processResult('HIT');
            } else if (dist < 70) {
                const r = Math.random();
                if (r < 0.4) processResult('FOUL');
                else if (r < 0.7) processResult('HIT');
                else processResult('GROUND_OUT');
            } else if (dist < 120) {
                processResult('FOUL');
            } else {
                processResult('STRIKE'); // 헛스윙
            }
        } else {
            processResult('STRIKE'); // 타이밍 미스
        }
    }
});

// 마우스 이동 (에임 / 타격 커서)
C.addEventListener('pointermove', (e) => {
    if (G.phase === 'PITCH_AIM') {
        const z = getZone();
        G.aimPos.x = ((e.clientX - z.cx) / (z.w/2));
        G.aimPos.y = ((e.clientY - z.cy) / (z.h/2));
    }
    if (G.batCursor.visible) {
        G.batCursor.x = e.clientX;
        G.batCursor.y = e.clientY;
    }
});

// ── 투구 실행 ──
function firePitch(isAI) {
    G.phase = 'BALL_FLY';
    const p = G.selectedPitch;
    const score = isAI ? (Math.random()*0.5+0.5) : G.timingScore;
    const spd = Math.floor(p.min + (p.max - p.min) * score);
    G.lastSpeed = spd;
    
    document.getElementById('pi-spd').textContent = spd;
    document.getElementById('pi-type').textContent = p.name;
    
    const z = getZone();
    const errX = (1 - score) * (Math.random()-0.5) * z.w * 0.8;
    const errY = (1 - score) * (Math.random()-0.5) * z.h * 0.8;
    
    const sx = CX, sy = H * 0.5;
    const ex = z.cx + (isAI ? (Math.random()-0.5)*z.w*1.3 : G.aimPos.x * z.w/2) + errX;
    const ey = z.cy + (isAI ? (Math.random()-0.5)*z.h*1.3 : G.aimPos.y * z.h/2) + errY;
    
    G.ball = {
        active: true,
        startTime: performance.now(),
        duration: (160 / spd) * 700,
        sx, sy, ex, ey,
        pitch: p,
        trail: []
    };
    
    G.pitcherAnim = 'throw'; G.pitcherFrame = 0;
    
    // 구속 표시
    const sd = document.getElementById('speed-display');
    document.getElementById('sd-v').textContent = spd;
    document.getElementById('sd-t').textContent = p.name;
    sd.classList.add('show');
    setTimeout(() => sd.classList.remove('show'), 2000);
}

function aiPitch() {
    const keys = Object.keys(PITCH_DATA);
    G.selectedPitch = PITCH_DATA[keys[Math.floor(Math.random()*keys.length)]];
    G.pitcherAnim = 'windup'; G.pitcherFrame = 0;
    setTimeout(() => firePitch(true), 600);
}

function onBallArrived(bx, by) {
    if (G.phase === 'RESULT') return; // 이미 스윙해서 결과 처리됨
    
    const z = getZone();
    const inZone = bx > z.x && bx < z.x+z.w && by > z.y && by < z.y+z.h;
    
    if (G.half === 'top') {
        // AI 타자 판정
        const swingChance = inZone ? 0.65 : 0.15;
        if (Math.random() < swingChance) {
            G.batterAnim = 'swing'; G.batterFrame = 0;
            const contactChance = inZone ? (0.55 - G.timingScore * 0.25) : 0.1;
            if (Math.random() < contactChance) {
                const r = Math.random();
                if (r < 0.05) processResult('HR');
                else if (r < 0.15) processResult('DOUBLE');
                else if (r < 0.35) processResult('HIT');
                else if (r < 0.5) processResult('FOUL');
                else if (r < 0.75) processResult('FLY_OUT');
                else processResult('GROUND_OUT');
            } else {
                processResult('STRIKE');
            }
        } else {
            processResult(inZone ? 'STRIKE' : 'BALL');
        }
    } else {
        // 유저가 안 치고 봄
        processResult(inZone ? 'STRIKE' : 'BALL');
    }
}

// ── 타이밍 게이지 애니메이션 ──
G.timingGaugeSize = 120;
function tickTimingGauge() {
    if (G.phase === 'PITCH_TIMING') {
        G.timingGaugeSize -= 2.5;
        if (G.timingGaugeSize < 15) G.timingGaugeSize = 120;
    }
    requestAnimationFrame(tickTimingGauge);
}
tickTimingGauge();

// ═══ 게임 시작 ═══
function startGame() {
    updateHUD();
    showInningScreen(() => startTurn());
}

requestAnimationFrame(gameLoop);

// 1초 후 시작 (폰트 로딩 대기)
setTimeout(startGame, 1000);

</script>
