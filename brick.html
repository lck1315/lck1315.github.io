<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DODO Arkanoid | 네온 벽돌깨기</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;touch-action:none}
body{background:#050510;color:#e2e8f0;font-family:'Outfit',sans-serif;overflow:hidden;margin:0;display:flex;justify-content:center;align-items:center;height:100vh}
#game-container{position:relative;width:100%;max-width:800px;height:100%;max-height:1000px;background:#000;box-shadow:0 0 50px rgba(6,182,212,0.2)}
canvas{display:block;width:100%;height:100%}
#ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;padding:20px;z-index:10}
.top-bar{display:flex;justify-content:space-between;align-items:flex-start}
h1{font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;color:#22d3ee;text-shadow:0 0 10px #22d3ee;margin-bottom:10px}
.stats{display:flex;gap:12px}
.stat-box{background:rgba(0,0,0,0.6);border:1px solid rgba(34,211,238,0.4);border-radius:12px;padding:8px 16px;text-align:center;backdrop-filter:blur(5px)}
.stat-box .label{font-size:0.7rem;color:#cbd5e1;letter-spacing:1px}
.stat-box .val{font-size:1.5rem;font-weight:900;color:#fff;font-family:'Orbitron',sans-serif;text-shadow:0 0 8px rgba(255,255,255,0.5)}
#overlay{position:absolute;inset:0;background:rgba(5,5,16,0.8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:auto;backdrop-filter:blur(8px)}
#overlay h2{font-family:'Orbitron',sans-serif;font-size:4rem;color:#facc15;text-shadow:0 0 30px rgba(250,204,21,0.5);margin-bottom:10px;text-align:center}
#overlay p{color:#94a3b8;margin:12px 0 30px;font-size:1.2rem;text-align:center}
.btn{padding:16px 40px;font-size:1.2rem;font-weight:900;font-family:'Orbitron',sans-serif;border:none;border-radius:30px;cursor:pointer;transition:all 0.2s;background:linear-gradient(135deg,#06b6d4,#3b82f6);color:#fff;box-shadow:0 6px 20px rgba(6,182,212,0.6);text-transform:uppercase;letter-spacing:2px}
.btn:hover{transform:scale(1.05);box-shadow:0 8px 25px rgba(6,182,212,0.8)}
.back-btn{position:fixed;top:20px;right:20px;background:rgba(0,0,0,0.5);color:#fff;padding:10px 20px;border-radius:20px;text-decoration:none;font-weight:700;z-index:100;border:1px solid rgba(255,255,255,0.2)}
</style>
</head>
<body>
<a href="game.html" class="back-btn">돌아가기</a>
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div class="top-bar">
            <h1>NEON BREAK</h1>
            <div class="stats">
                <div class="stat-box">
                    <div class="label">SCORE</div>
                    <div class="val" id="score">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">LIVES</div>
                    <div class="val" id="lives" style="color:#ef4444;text-shadow:0 0 10px #ef4444">3</div>
                </div>
            </div>
        </div>
    </div>
    <div id="overlay">
        <h2>ARKANOID</h2>
        <p>마우스나 터치로 패들을 조작하여 모든 벽돌을 파괴하세요!</p>
        <button class="btn" onclick="startGame()">START GAME</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
    const parent = document.getElementById('game-container');
    W = parent.clientWidth;
    H = parent.clientHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Game objects
let paddle, ball, bricks, particles;
let score = 0, lives = 3;
let playing = false;
let colors = ['#ef4444', '#f59e0b', '#22c55e', '#06b6d4', '#3b82f6', '#ec4899'];

function initGame() {
    paddle = { x: W/2 - 50, y: H - 50, w: 100, h: 12, speed: 8, targetX: W/2 };
    ball = { x: W/2, y: H - 70, r: 8, dx: 4 * (Math.random()>0.5?1:-1), dy: -4, speed: 6 };
    bricks = [];
    particles = [];
    score = 0; lives = 3;
    updateUI();
    
    // Create Bricks
    const rows = 6;
    const cols = 8;
    const pad = 10;
    const offsetTop = 80;
    const offsetLeft = 20;
    const bW = (W - (offsetLeft * 2) - (pad * (cols - 1))) / cols;
    const bH = 24;
    
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            bricks.push({
                x: offsetLeft + c*(bW+pad),
                y: offsetTop + r*(bH+pad),
                w: bW, h: bH,
                status: 1,
                color: colors[r % colors.length]
            });
        }
    }
}

function updateUI() {
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = lives;
}

function spawnParticles(x, y, color) {
    for(let i=0; i<15; i++) {
        particles.push({
            x, y,
            vx: (Math.random()-0.5)*8,
            vy: (Math.random()-0.5)*8,
            life: 1.0,
            color
        });
    }
}

function drawRect(x, y, w, h, color, glow) {
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.fillStyle = color;
    if(glow) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = color;
    } else {
        ctx.shadowBlur = 0;
    }
    ctx.fill();
    ctx.closePath();
}

function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#fff';
    ctx.fill();
    ctx.closePath();
}

function draw() {
    // Clear with trail effect
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5, 5, 16, 0.3)';
    ctx.fillRect(0, 0, W, H);
    ctx.shadowBlur = 0;
    
    ctx.globalCompositeOperation = 'lighter';
    
    // Draw Bricks
    let activeBricks = 0;
    bricks.forEach(b => {
        if(b.status === 1) {
            drawRect(b.x, b.y, b.w, b.h, b.color, true);
            activeBricks++;
        }
    });
    
    if(activeBricks === 0 && playing) {
        gameOver("YOU WIN! 🎉");
    }
    
    // Draw Paddle
    drawRect(paddle.x, paddle.y, paddle.w, paddle.h, '#22d3ee', true);
    
    // Draw Ball
    drawBall();
    
    // Draw Particles
    for(let i=particles.length-1; i>=0; i--) {
        const p = particles[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fill();
        
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.02;
        if(p.life <= 0) particles.splice(i, 1);
    }
    ctx.globalCompositeOperation = 'source-over';
}

function update() {
    if(!playing) return;
    
    // Paddle movement
    paddle.x += (paddle.targetX - paddle.w/2 - paddle.x) * 0.2;
    if(paddle.x < 0) paddle.x = 0;
    if(paddle.x + paddle.w > W) paddle.x = W - paddle.w;
    
    // Ball movement
    ball.x += ball.dx;
    ball.y += ball.dy;
    
    // Wall collision
    if(ball.x + ball.dx > W - ball.r || ball.x + ball.dx < ball.r) ball.dx = -ball.dx;
    if(ball.y + ball.dy < ball.r) ball.dy = -ball.dy;
    
    // Bottom collision (Death)
    if(ball.y + ball.dy > H - ball.r) {
        lives--;
        updateUI();
        if(lives === 0) gameOver("GAME OVER");
        else {
            ball.x = paddle.x + paddle.w/2;
            ball.y = paddle.y - 10;
            ball.dx = 4 * (Math.random()>0.5?1:-1);
            ball.dy = -4;
        }
    }
    
    // Paddle collision
    if(ball.y + ball.r >= paddle.y && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
        ball.dy = -ball.speed;
        // Angle based on hit point
        let hitPoint = ball.x - (paddle.x + paddle.w/2);
        ball.dx = hitPoint * 0.15;
    }
    
    // Brick collision
    for(let i=0; i<bricks.length; i++) {
        let b = bricks[i];
        if(b.status === 1) {
            if(ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
                ball.dy = -ball.dy;
                b.status = 0;
                score += 10;
                updateUI();
                spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color);
                
                // Increase speed slightly
                if(score % 100 === 0) ball.speed += 0.5;
            }
        }
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Input
function onInput(e) {
    if(e.touches) paddle.targetX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
    else paddle.targetX = e.clientX - canvas.getBoundingClientRect().left;
}
window.addEventListener('mousemove', onInput);
window.addEventListener('touchmove', onInput, {passive: false});

function gameOver(msg) {
    playing = false;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('overlay').querySelector('h2').textContent = msg;
    document.getElementById('overlay').querySelector('p').textContent = 'FINAL SCORE: ' + score;
}

function startGame() {
    initGame();
    document.getElementById('overlay').style.display = 'none';
    playing = true;
}

initGame();
draw();
loop();
</script>
</body>
</html>
