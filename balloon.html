<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DODO Balloon Pop | 3D 아케이드</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;touch-action:none}
body{background:#0ea5e9;color:#e2e8f0;font-family:'Outfit',sans-serif;overflow:hidden;margin:0}
#ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;padding:20px;z-index:10}
h1{font-family:'Orbitron',sans-serif;font-size:2.5rem;font-weight:900;background:linear-gradient(135deg,#facc15,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 4px 10px rgba(0,0,0,0.3);margin-bottom:10px}
.top-bar{display:flex;justify-content:space-between;align-items:flex-start}
.stats{display:flex;gap:12px}
.stat-box{background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.4);border-radius:12px;padding:12px 20px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.2);backdrop-filter:blur(5px)}
.stat-box .label{font-size:0.8rem;color:#f8fafc;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,0.3)}
.stat-box .val{font-size:2rem;font-weight:900;color:#fff;font-family:'Orbitron',sans-serif;text-shadow:0 2px 5px rgba(0,0,0,0.5)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:auto;backdrop-filter:blur(8px)}
#overlay h2{font-family:'Orbitron',sans-serif;font-size:4rem;color:#facc15;text-shadow:0 0 30px rgba(250,204,21,0.5);margin-bottom:10px}
#overlay p{color:#f8fafc;margin:12px 0 30px;font-size:1.5rem}
.btn{padding:16px 40px;font-size:1.2rem;font-weight:900;font-family:'Orbitron',sans-serif;border:none;border-radius:30px;cursor:pointer;transition:all 0.2s;background:linear-gradient(135deg,#ec4899,#e11d48);color:#fff;box-shadow:0 6px 20px rgba(225,29,72,0.6);text-transform:uppercase;letter-spacing:2px}
.btn:hover{transform:scale(1.05);box-shadow:0 8px 25px rgba(225,29,72,0.8)}
#game-container{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;cursor:crosshair}
.back-btn{position:fixed;top:20px;right:20px;background:rgba(0,0,0,0.5);color:#fff;padding:10px 20px;border-radius:20px;text-decoration:none;font-weight:700;z-index:100;backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,0.2)}
.hearts{font-size:1.5rem;color:#ef4444;text-shadow:0 2px 5px rgba(0,0,0,0.5)}
</style>
</head>
<body>
<a href="game.html" class="back-btn">돌아가기</a>
<div id="game-container"></div>
<div id="ui-layer">
    <div class="top-bar">
        <h1>DODO BALLOON</h1>
        <div class="stats">
            <div class="stat-box">
                <div class="label">SCORE</div>
                <div class="val" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="label">LIVES</div>
                <div class="val hearts" id="lives">❤️❤️❤️</div>
            </div>
        </div>
    </div>
</div>
<div id="overlay">
    <h2>BALLOON POP</h2>
    <p>하늘로 떠오르는 풍선을 모두 터트리세요!</p>
    <button class="btn" onclick="startGame()">START GAME</button>
</div>

<script>
let score = 0, lives = 3;
let playing = false;
let clock = new THREE.Clock();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x38bdf8); // Sky blue
scene.fog = new THREE.FogExp2(0x38bdf8, 0.02);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 10);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('game-container').appendChild(renderer.domElement);

// Lights
const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// Arrays
let balloons = [];
let particles = [];
let spawnTimer = 0;
let spawnRate = 1.0; // Seconds

// Balloon Geometry
const bGeo = new THREE.SphereGeometry(1, 32, 32);
const kGeo = new THREE.ConeGeometry(0.2, 0.4, 8); // Knot
kGeo.translate(0, -1.0, 0);

const colors = [0xef4444, 0x3b82f6, 0x22c55e, 0xf59e0b, 0xa855f7, 0xec4899];

function createBalloon() {
    const color = colors[Math.floor(Math.random() * colors.length)];
    const mat = new THREE.MeshPhysicalMaterial({
        color: color,
        metalness: 0.1,
        roughness: 0.1,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transparent: true,
        opacity: 0.9
    });
    
    const bMesh = new THREE.Mesh(bGeo, mat);
    const kMesh = new THREE.Mesh(kGeo, mat);
    bMesh.add(kMesh); // Attach knot
    
    // Random position at bottom
    bMesh.position.set((Math.random() - 0.5) * 12, -8, (Math.random() - 0.5) * 4);
    
    // Store variables
    bMesh.userData = {
        vy: 3 + Math.random() * 3 + (score * 0.05), // speed increases with score
        wx: Math.random() * 2, // wobble phase
        color: color
    };
    
    scene.add(bMesh);
    balloons.push(bMesh);
}

function createExplosion(pos, color) {
    const pGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    const pMat = new THREE.MeshBasicMaterial({color: color});
    
    for(let i=0; i<15; i++) {
        const p = new THREE.Mesh(pGeo, pMat);
        p.position.copy(pos);
        p.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
        scene.add(p);
        particles.push({
            mesh: p,
            vx: (Math.random()-0.5)*10,
            vy: (Math.random()-0.5)*10,
            vz: (Math.random()-0.5)*10,
            life: 1.0
        });
    }
}

function updateHearts() {
    let s = '';
    for(let i=0; i<3; i++) s += i < lives ? '❤️' : '🖤';
    document.getElementById('lives').textContent = s;
}

function gameOver() {
    playing = false;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('overlay').querySelector('h2').textContent = 'GAME OVER';
    document.getElementById('overlay').querySelector('p').textContent = 'FINAL SCORE: ' + score;
    // Clear balloons
    balloons.forEach(b => { scene.remove(b); b.geometry.dispose(); b.material.dispose(); });
    balloons = [];
}

function startGame() {
    score = 0; lives = 3; spawnRate = 1.0;
    document.getElementById('score').textContent = score;
    updateHearts();
    document.getElementById('overlay').style.display = 'none';
    playing = true;
}

// Raycasting for popping
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('pointerdown', (e) => {
    if(!playing) return;
    
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    
    const intersects = raycaster.intersectObjects(balloons);
    
    if(intersects.length > 0) {
        const obj = intersects[0].object;
        // Pop!
        createExplosion(obj.position, obj.userData.color);
        scene.remove(obj);
        obj.geometry.dispose(); obj.material.dispose();
        balloons = balloons.filter(b => b !== obj);
        
        score += 10;
        document.getElementById('score').textContent = score;
        spawnRate = Math.max(0.3, 1.0 - (score * 0.005)); // Increase difficulty
    }
});

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);
    
    if(playing) {
        // Spawn
        spawnTimer += dt;
        if(spawnTimer > spawnRate) {
            spawnTimer = 0;
            createBalloon();
        }
        
        // Update balloons
        const time = performance.now() * 0.001;
        for(let i = balloons.length - 1; i >= 0; i--) {
            const b = balloons[i];
            b.position.y += b.userData.vy * dt;
            b.position.x += Math.sin(time * 3 + b.userData.wx) * 0.02; // Wobble
            
            if(b.position.y > 8) {
                // Missed
                scene.remove(b);
                b.geometry.dispose(); b.material.dispose();
                balloons.splice(i, 1);
                lives--;
                updateHearts();
                if(lives <= 0) gameOver();
            }
        }
    }
    
    // Update particles
    for(let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        p.vy -= 15 * dt; // gravity
        p.life -= dt * 1.5;
        p.mesh.scale.setScalar(p.life);
        
        if(p.life <= 0) {
            scene.remove(p.mesh);
            p.mesh.geometry.dispose(); p.mesh.material.dispose();
            particles.splice(i, 1);
        }
    }
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
